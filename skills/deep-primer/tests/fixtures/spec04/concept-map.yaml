  - concept_id: quantized-partition
    canonical_term: "quantized partition"
    aliases: ["coarse quantizer", "IVF-PQ"]
    home_anchor: "static index pruning, where a lossy summary answers most queries and the full postings are the fallback"
    fidelity_boundary: "breaks because pruning deletes postings outright, while quantization keeps every vector and distorts its distance, so the loss surfaces as reordering rather than absence"
    epistemic_status: settled
    salience: 0.8
    representation_modes:
      - {mode: mental_model, block_ref: card-quantize}
      - {mode: cost, block_ref: matrix-quantize}
