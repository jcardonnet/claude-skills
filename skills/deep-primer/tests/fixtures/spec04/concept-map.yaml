  - concept_id: index-churn
    canonical_term: "index churn"
    aliases: ["rebuild cadence"]
    home_anchor: "a segment merge policy, where writes accumulate until a merge pays them down"
    fidelity_boundary: "breaks because a merge rewrites postings losslessly, while a rebuild changes which neighbours are reachable, so measured recall moves when the corpus did not"
    epistemic_status: contested
    salience: 0.6
    representation_modes:
