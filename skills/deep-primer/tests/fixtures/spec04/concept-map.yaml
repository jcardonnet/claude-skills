# Concept-map for spec-04-seeded-vector-index (document-ir.yaml in this directory).
#
# Three concepts, each realized in >=3 distinct modes so R-MV-01 passes. Every home_anchor names an
# ADJACENT technique the classical-IR reader already owns — skip pointers, static pruning, segment
# merges — never the target concept restated (R-XREF-04).
#
# `contested: true` is not decoration: the graph-index section carries a `role: contested` block,
# because the user's seed paper and the discovered sources disagree about where the recall-latency
# frontier lives at billion scale. The structure is presented, not asserted (R-DISC-06).
#
# source_ids and claim_ids are the real campaign identifiers (2026-08-21) — see source-ledger.yaml.
# Each concept lists the sources and claims its own blocks cite, so the map and the IR can be
# cross-checked against each other without reading the prose.
contested: true
concepts:
  - concept_id: graph-index
    canonical_term: "graph index"
    aliases: ["proximity graph", "HNSW"]
    home_anchor: "skip pointers on a posting list, coarse hops first and fine ones near the answer"
    fidelity_boundary: "breaks because skip pointers never lose a document, while a walk can strand a true neighbour in a region it never enters"
    epistemic_status: contested
    salience: 0.9
    representation_modes:
      - {mode: mental_model, block_ref: card-graph}
      - {mode: tradeoff, block_ref: contested-graph}
      - {mode: architecture, block_ref: fig-graph}
      - {mode: failure, block_ref: body-graph-entry}
