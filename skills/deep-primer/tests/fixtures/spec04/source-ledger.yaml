# Source-ledger for spec-04-seeded-vector-index.
#
# EVERY SOURCE HERE IS SYNTHETIC. The URLs are example.org, the authors and venues are invented, and
# the content hashes are placeholders. This fixture exercises the ledger CONTRACT — provenance
# origin, corroboration, conflict, recency, quote discipline — and asserts nothing about the world.
# It is deliberately not built the way spec-02's ledger was (real pages, verbatim-verified quotes);
# nothing in this file should ever be mistaken for evidence.
#
# Quotes are <=15 words (R-GROUND-01) and lexically close to the statements they support, so the
# offline lexical entailment proxy resolves them.
#
# s-seed is the user's URL seed (R-DISC-06): provenance_origin=user on the source AND on its claims.
# It is consulted and grounded like any other source, exempt from triage-drop, and still
# corroboration-graded — C-graph-1 is corroborated, C-graph-2 is contested by the discovered
# consensus and routes to the contested rendering rather than being asserted.
sources:
  - source_id: s-seed
    url: "https://example.org/hnsw-paper"
    title: "A navigable graph index for approximate search"
    authors: ["M. Fictional"]
    venue: "Example Symposium"
    date: "2024-06-01"
    type: primary_paper
    credibility: high
    provenance_origin: user
    retrieved_at: "2026-08-18T00:00:00Z"
    content_hash: "c0ffee11"
    claims:
      - claim_id: C-graph-1
        text: "a walk over neighbours makes probe count grow with the logarithm of corpus size"
        quote: "a walk over neighbours, so probe count grows with the logarithm of corpus size"
        location: "p.3 / §2"
        confidence: high
        provenance_origin: user
        corroboration_count: 2
        corroborated_by: [s-survey]
      # The seed's strong claim, and the one the discovered consensus rejects. A seed is
      # authoritative for INCLUSION, never for truth: this stays contested + singly-supported and
      # renders through `contested-graph`, not as a settled assertion (R-DISC-06).
      - claim_id: C-graph-2
        text: "a graph index dominates the recall-latency frontier at every corpus scale"
        quote: "the graph index dominates the recall-latency frontier at every scale"
        location: "p.9 / §6"
        confidence: medium
        provenance_origin: user
        corroboration_count: 1
        contested: true
        contradicts: [C-quant-2]

