# Document IR for spec-04-seeded-vector-index — the seed_sources stress case (R-DISC-06).
#
# The reader lives in classical IR: they already own posting lists, skip pointers, static pruning
# and segment merges. Nothing here re-teaches those; every home_anchor spends them.
#
# SOURCES ARE REAL (2026-08-21 campaign) — see source-ledger.yaml. Every block_id, role,
# artifact_kind, mode, heading, section title and concept id is unchanged from the structural
# fixture this replaced; only the claim-bearing prose and its citations were re-drafted against what
# the campaign actually found. Two blocks moved inferred -> verified because a real source states
# exactly what they assert: [fig-graph], whose claim that unvisited regions cost recall is stated by
# the production write-up, and [body-graph-degree], whose claim that degree is a memory decision is
# stated as a formula in which the degree term multiplies the footprint. That is what takes
# ungrounded_share down from 0.56.
#
# The blocks still marked `inferred` are inferred by their nature, not by accident: a decision
# matrix, a benchmark-comparison figure, two sub-summaries, two extended mechanism narratives, a
# Toulmin argument and a failure catalog are synthesis GROUNDED IN cited claims, not restatements
# of them.
#
# THE SEED IS A REAL PAPER NOW. This fixture used to seed `https://example.org/hnsw-paper`, which
# cannot be fetched; `triage_leads` checks fetch-failure before it applies the R-DISC-06 exemption,
# so on a real campaign the seed was dropped before the rule it exists to exercise could see it.
# The seed now points at arXiv 1603.09320, the Hierarchical NSW paper, which the campaign retrieved
# by ordinary discovery, and the author directive "Y. Malkov" names that paper's first author.
#
# What is unusual about this IR is unchanged: `contested-graph` is a `role: contested` block. The
# seed claims its index outperforms the prior open-source state of the art; the discovered sources
# report that at billion scale under a memory ceiling a disk-resident index is the one that meets
# the target. A seed is authoritative for inclusion and not for truth, so the disagreement is
# PRESENTED as two framings rather than resolved into an assertion.
