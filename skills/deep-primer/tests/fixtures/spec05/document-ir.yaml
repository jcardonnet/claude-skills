# Document IR for spec-05-clinical-trial-design — the NON-SOFTWARE reference artifact.
#
# The registry's rules are domain-independent by design; this is the primer that has to prove it.
# Nothing here is a pipeline, a service or a version: the vocabulary is interim analysis, conditional
# error functions, sample-size re-estimation, futility declarations and regulatory pre-specification,
# and the same seven card rows, four operational artifacts and three-per-section recall items carry it.
#
# SOURCES ARE REAL AS OF 2026-08-21. This artifact was re-grounded against a live retrieval campaign
# (131 documents, 30 sources, 283 claims kept); the ten sources and 34 claims that survived curation
# are in source-ledger.yaml, whose header records what was dropped and why. The previous revision of
# this file used openly synthetic example.org sources and made no grounding claim.
#
# THE FIRST CONCEPT WAS RENAMED AS PART OF THAT RE-GROUNDING. It was `alpha-spending`. The campaign
# retrieved nothing on alpha spending functions, O'Brien-Fleming, Pocock or Lan-DeMets, so every
# sentence that named them is gone. What the corpus documents instead, in depth, is the conditional
# error function: the ceiling on type I error still reachable from whatever the interim data turned
# out to be. Keeping the old heading and citing conditional-error claims under it is the exact
# failure GAPS.md G17 describes, so the heading moved to the evidence rather than the other way.
#
# EXPECT CITATION PRECISION TO FALL SHARPLY against the previous revision, as it did for spec-04
# (0.375 -> 0.023). That is not a regression. The synthetic quotes it replaced were byte-identical to
# the claim texts that cited them, which is trivially entailed and measures nothing. These quotes are
# <=15 words of real source prose and are deliberately not lexically close to the prose citing them,
# so a lexical verifier scores them near zero and an entailment model has actual work to do.
