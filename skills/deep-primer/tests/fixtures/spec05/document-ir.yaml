sections:
  - block_id: sec-cef
    title: "An adaptation you did not name in advance has no error rate"
    concept: conditional-error-function
    blocks:
      - block_id: lede-cef
        role: lede
        text: "An adaptive design permits pre-specified modifications of a running trial on the strength of an interim analysis."
        claim_ids: [C-71047f73-2]
        provenance: verified
        source_ids: [71047f73f17ae532f5113b463247fc7e3d981aef]
      - block_id: card-cef
        role: card
        concept: conditional-error-function
        mode: mental_model
        claim_ids: [C-b42f6bdc-12, C-64ab2594-3, C-b42f6bdc-4]
        provenance: verified
        source_ids: [b42f6bdc4c163fb4259fad0399504ff443c71998, 64ab25940d44e96401ad8256567d6a9af398d074]
        row_claims:
          idea: [C-b42f6bdc-12]
          key_exemplar: [C-64ab2594-3]
        rows:
          idea: "A conditional error function reports the largest type I error rate still reachable from whatever the interim data turned out to be."
          home_anchor: "Like a multiple-comparison budget split across contrasts you declared before seeing the data."
          whats_new_vs_renamed: "Group sequential testing is renamed, not new: it is a special case of the general adaptive design. New is that the second stage is designed after the first is read."
          reach_for_when: "Reach for it when the second stage's design may still move on what the first stage shows."
          skip_when: "Skip it for a fixed-sample analysis, where no interim result will ever be read."
          key_exemplar: "The critical value function, which is the same object written the other way round."
          confidence: "settled for the error arithmetic; contested for which conditional error function to prefer"
      - block_id: matrix-cef
        role: matrix
        artifact_kind: decision_matrix
        concept: conditional-error-function
        mode: tradeoff
        text: "Criteria: whether the rule has a closed form, how much conditional power it buys, and how much must be fixed before the first patient. Baseline: an optimal conditional error function derived by variational calculus, which maximises conditional power pointwise and thereby maximises overall power. It pays for that with no closed formula, so the boundary is a numerical object recomputed rather than read off a table. A fixed function declared up front buys less power, and buys back a second-stage p-value whose null behaviour is easy to check. Recommendation: take the fixed rule unless the sponsor can name the interim outcome whose second stage would genuinely differ."
        claim_ids: [C-64ab2594-13, C-64ab2594-10, C-b42f6bdc-19]
        # inferred, not verified: the criteria, the named baseline and the recommendation are
        # synthesis GROUNDED IN the sources rather than stated by them.
        provenance: inferred
        source_ids: [64ab25940d44e96401ad8256567d6a9af398d074, b42f6bdc4c163fb4259fad0399504ff443c71998]
      - block_id: toulmin-cef
        role: toulmin
        concept: conditional-error-function
        mode: cost
        text: "Claim: fix the second stage's test before the first stage is read. Data: that test is what multiplicity-adjusted inference needs defined in advance, and a confirmatory adaptive trial must hold its nominal rate regardless. Warrant: that rate bounds the chance of rejecting at least one true hypothesis, and a design picked after the interim sits outside it. Qualifier: the rate holds only while the second-stage p-value stays no smaller than uniform under the null. Rebuttal: the same rate costs an exploratory trial its speed and buys a guarantee nobody there will rely on."
        claim_ids: [C-5426dd09-9, C-c013edc2-23, C-b42f6bdc-23, C-b42f6bdc-19]
        # inferred: the qualifier and the rebuttal are the author's operational judgement, which is
        # exactly what a Toulmin structure is for and exactly what no quote can entail.
        provenance: inferred
        source_ids: [5426dd096a626a9b4e81a8571e3c36738b087bdd, c013edc2ce9b67b7d54fc8a8a238089b42d6ffeb, b42f6bdc4c163fb4259fad0399504ff443c71998]
      - block_id: checklist-cef
        role: matrix
        artifact_kind: checklist
        text: "Confirm the protocol describes which types of adaptation are intended. Verify the first stage's sample size and test statistic are prespecified before the trial opens. Check that every adaptation performed is documented in a prescheduled amendment to the protocol. Confirm the interim analyses are planned prospectively with their decision rules attached, rather than proposed once the data are in. Record the looks that were scheduled and not taken, alongside those that were."
        claim_ids: [C-b42f6bdc-11, C-b42f6bdc-15, C-b42f6bdc-10, C-c013edc2-7]
        provenance: inferred
        source_ids: [b42f6bdc4c163fb4259fad0399504ff443c71998, c013edc2ce9b67b7d54fc8a8a238089b42d6ffeb]
      - block_id: fig-cef
        role: figure
        concept: conditional-error-function
        mode: architecture
        caption: "Figure 1: one ceiling of alpha = 0.025 enters at the left, and each interim outcome maps to the part of it the second stage may still spend."
        svg_ref: "synthetic/conditional-error.svg"
        claim_ids: [C-b42f6bdc-12, C-64ab2594-19]
        # inferred: the diagram RENDERS the cited claims rather than restating them
        provenance: inferred
        source_ids: [b42f6bdc4c163fb4259fad0399504ff443c71998, 64ab25940d44e96401ad8256567d6a9af398d074]
      - block_id: recall-cef
        role: recall
        concept: conditional-error-function
        items:
          - question: "Your team wants to change the second stage's endpoint after reading the first stage. What has to already exist for that to be legitimate?"
            answer: "A protocol that named this type of adaptation in advance, and a prescheduled amendment that will document the one you performed."
          - question: "You already correct for multiplicity across contrasts declared in advance. What carries over to a two-stage adaptive design, and what does not?"
            answer: "Bounding the chance of one false rejection carries over. A fixed partition does not, because the second stage is designed on the first stage's result."
            cross_domain: true
          - question: "A protocol says interim analyses will be performed as required. Why is that sentence fatal?"
            answer: "The adaptation is unnamed, so nothing prescheduled covers it and no conditional error function was ever computed for the design that ran."

    subsections:
      - block_id: sub-cef-pre
        title: "A boundary the regulator has not seen in advance is not a boundary"
        concept: conditional-error-function
        blocks:
          - block_id: subsum-cef-pre
            role: summary
            text: "The study protocol has to describe which types of adaptation are intended, before the trial begins."
            claim_ids: [C-b42f6bdc-11]
            provenance: verified
            source_ids: [b42f6bdc4c163fb4259fad0399504ff443c71998]
          - block_id: body-cef-pre
            role: body
            concept: conditional-error-function
            mode: failure
            heading: "Where an unnamed adaptation destroys the error argument"
            text: "An adaptation earns its error control by being named in the protocol before the data speak. The protocol that names it is also what a prescheduled amendment later documents, and ICH E6 sets the international standard for that record. The standard covers how a trial is designed, conducted, recorded and reported, and its current revision asks for a risk-based and proportionate approach. A proportionate approach is what a sponsor under commercial pressure reads as licence to document less. That licence is how a prescheduled amendment quietly becomes a retrospective one."
            claim_ids: [C-52e7543f-7, C-52e7543f-6, C-b42f6bdc-10]
            # inferred: the erosion argument is synthesis across three cited claims, and a five-sentence
            # block is longer than any 15-word quote can entail.
            provenance: inferred
            source_ids: [52e7543fccd0f1ec2aca26ca9f7834481c851371, b42f6bdc4c163fb4259fad0399504ff443c71998]

  - block_id: sec-ssr
    title: "Re-estimating the sample size blind is nearly free; unblinding it is not"
    concept: sample-size-reestimation
    blocks:
      - block_id: lede-ssr
        role: lede
        text: "Uncertainty about the variance at the design stage leaves a trial at risk of being under-powered or over-powered."
        claim_ids: [C-e000d90c-2]
        provenance: verified
        source_ids: [e000d90cf92d65ce0d3f2a9066c1d615ff4ed907]
      - block_id: card-ssr
        role: card
        concept: sample-size-reestimation
        mode: mental_model
        claim_ids: [C-07c9a426-1, C-07c9a426-2, C-e000d90c-4]
        provenance: verified
        source_ids: [07c9a42632db2304755b95778286b7bef2a0a5d4, e000d90cf92d65ce0d3f2a9066c1d615ff4ed907]
        row_claims:
          idea: [C-07c9a426-1]
          key_exemplar: [C-07c9a426-2]
        rows:
          idea: "Sample-size re-estimation is an adaptive design that adjusts the enrolment target at an interim point."
          home_anchor: "Like redoing a power calculation on a pilot's variance estimate, except the pilot is this trial."
          whats_new_vs_renamed: "The power calculation is renamed, not new; new is that its input comes from the running trial and can feed back into the test."
          reach_for_when: "Reach for it when the assumed variance rests on external data thinner than the trial it is sizing."
          skip_when: "Skip the unblinded form unless the protocol already fixes the test that will absorb it."
          key_exemplar: "The split into blinded and unblinded methods, which is the whole of the decision."
          confidence: "settled that regulators favour the blinded form; contested for what the unblinded form is actually for"
      - block_id: toulmin-ssr
        role: toulmin
        concept: sample-size-reestimation
        mode: tradeoff
        text: "Claim: re-estimate the variance blind, and treat the unblinded form as an exception you have to argue for. Data: the blinded form is the one regulators favour, and simulations put its performance close to the unblinded one in many cases. Warrant: a variance recomputed across the pooled arms cannot leak which arm is winning, which is what makes that form cheap. Qualifier: the variance has to be a genuine nuisance parameter for the argument to hold. Rebuttal: the variance is not what a dissenting camp wants fixed, since it reads the real uncertainty as the effect size."
        claim_ids: [C-e000d90c-4, C-e000d90c-7, C-07c9a426-3]
        # inferred: the rebuttal presents the contested pair C-07c9a426-3 / C-e000d90c-7 rather than
        # asserting either side, so no single quote entails the block.
        provenance: inferred
        source_ids: [e000d90cf92d65ce0d3f2a9066c1d615ff4ed907, 07c9a42632db2304755b95778286b7bef2a0a5d4]
      - block_id: failures-ssr
        role: matrix
        artifact_kind: failure_catalog
        concept: sample-size-reestimation
        mode: failure
        text: "Planning on precision nobody has: the inputs a protocol relies on are generally not available with the precision the calculation assumes, and re-estimation is a repair rather than a licence. Unblinded peek without a pre-fixed test: the conventional statistic no longer controls the rate, and no later adjustment recovers it. Uncapped re-estimation: a rule with no stated maximum lets a small observed effect drive enrolment upward without limit. Optimising the wrong design: the variational argument that yields an optimal rule does not apply to the promising-zone design, so a rule borrowed across is not the optimum it was in its own setting."
        claim_ids: [C-b42f6bdc-9, C-64ab2594-8, C-07c9a426-3]
        provenance: inferred
        source_ids: [b42f6bdc4c163fb4259fad0399504ff443c71998, 64ab25940d44e96401ad8256567d6a9af398d074, 07c9a42632db2304755b95778286b7bef2a0a5d4]
      - block_id: fig-ssr
        role: figure
        concept: sample-size-reestimation
        mode: benchmark
        caption: "Figure 2: power against the variance actually observed, with the blinded and unblinded curves separating only where the design-stage guess was badly wrong."
        svg_ref: "synthetic/reestimation-power.svg"
        claim_ids: [C-e000d90c-7]
        provenance: inferred
        source_ids: [e000d90cf92d65ce0d3f2a9066c1d615ff4ed907]
      - block_id: recall-ssr
        role: recall
        concept: sample-size-reestimation
        items:
          - question: "The observed pooled variance is double the planned value at the halfway look. What may you change, and under what constraint?"
            answer: "Enrolment may rise to the maximum the protocol already fixed, provided the re-estimation stayed blind to the treatment allocations."
          - question: "You would normally rerun a power calculation on a pilot study. Why is reusing this trial's own data different?"
            answer: "The pilot data are the trial data, so the estimate feeds back into the very test that will be reported."
            cross_domain: true
          - question: "A sponsor proposes re-estimating on an unblinded interim effect estimate. What must accompany that proposal?"
            answer: "A test fixed in advance that absorbs the adaptation, plus a firewall keeping the sponsor away from the unblinded data."

    subsections:
      - block_id: sub-ssr-blinded
        title: "Why pooling the arms is what makes the re-read cheap"
        concept: sample-size-reestimation
        blocks:
          - block_id: subsum-ssr
            role: summary
            text: "Regulators favour a procedure that keeps the treatment allocations blinded."
            claim_ids: [C-e000d90c-4]
            provenance: verified
            source_ids: [e000d90cf92d65ce0d3f2a9066c1d615ff4ed907]
          - block_id: body-ssr
            role: body
            concept: sample-size-reestimation
            mode: architecture
            heading: "What the pooled estimate can and cannot see"
            text: "A trial is sized on a variance nobody has measured yet, and that design-stage guess is what leaves it under-powered or over-powered. The pooled variance is computed across both arms at once, with no allocation applied, so it cannot separate a treatment difference from ordinary noise. That variance is therefore blind to which arm did better, and its blindness is the whole economy of the method. The method was the field's first preoccupation, and the recalculation rule of Proschan and Hunsberger is where its unblinded version was made respectable."
            claim_ids: [C-e000d90c-2, C-b42f6bdc-8, C-64ab2594-12]
            # inferred: the mechanism is the author's explanation of WHY the cited results hold
            provenance: inferred
            source_ids: [e000d90cf92d65ce0d3f2a9066c1d615ff4ed907, b42f6bdc4c163fb4259fad0399504ff443c71998, 64ab25940d44e96401ad8256567d6a9af398d074]

  - block_id: sec-futility
    title: "A futility rule protects patients only if a committee is obliged to read it"
    concept: futility-boundary
    blocks:
      - block_id: lede-futility
        role: lede
        text: "Only about 32% of published adaptive trials reported an independent data monitoring committee."
        claim_ids: [C-c013edc2-21]
        provenance: verified
        source_ids: [c013edc2ce9b67b7d54fc8a8a238089b42d6ffeb]
      - block_id: card-futility
        role: card
        concept: futility-boundary
        mode: mental_model
        claim_ids: [C-8137885c-6, C-8137885c-20]
        provenance: verified
        source_ids: [8137885ca54412cc0e3cf5246a01b4967b3be8e4]
        row_claims:
          idea: [C-8137885c-6]
          key_exemplar: [C-8137885c-20]
        rows:
          idea: "A futility rule lets the first stage declare futility instead of promoting a dose into the second."
          home_anchor: "Like the acceptance region of a sequential probability ratio test, drawn before the first observation."
          whats_new_vs_renamed: "The stopping region is renamed, not new; new is that a standing committee reads it on a schedule and can act on what it sees."
          reach_for_when: "Reach for one whenever an inferior arm carries real burden for the patients on it."
          skip_when: "Skip it when the endpoint matures so late that no interim look could inform the decision."
          key_exemplar: "A dose-finding trial whose monitoring committee reviewed the adaptive algorithm every two months."
          confidence: "settled that the rule can be written; contested whether the committee that would enforce it exists"
      - block_id: aid-futility
        role: matrix
        artifact_kind: decision_aid
        concept: futility-boundary
        mode: tradeoff
        text: "Ask who reads the interim result and on what cadence, and write the answer into the charter before the first look. If a standing committee reviews the adaptive algorithm on a fixed schedule, the futility rule has someone to enforce it and the patients get the protection. If no independent committee is named, treat the rule as decoration and size the trial as though it were absent. The base rate favours the second reading, since only about a third of published adaptive trials reported an independent committee at all."
        claim_ids: [C-c013edc2-21, C-8137885c-20]
        provenance: inferred
        source_ids: [c013edc2ce9b67b7d54fc8a8a238089b42d6ffeb, 8137885ca54412cc0e3cf5246a01b4967b3be8e4]
      - block_id: body-futility
        role: body
        concept: futility-boundary
        mode: failure
        heading: "Stopping early changes the number you get to report"
        text: "A treatment effect estimated from a trial stopped early for efficacy carries substantial conditional bias, because the stopping rule selected the look that crossed. That effect arrives with an interval, and the interval is wrong for the same reason. A standard confidence interval assumes an underlying normal distribution, and the stopping rule is precisely what breaks that assumption. The stopping rule and the estimate are one object, and reporting the second as though the first had never happened is the common failure."
        claim_ids: [C-5426dd09-12, C-3667249d-9]
        # inferred: the joint conclusion is the author's, drawn from two independently cited results
        provenance: inferred
        source_ids: [5426dd096a626a9b4e81a8571e3c36738b087bdd, 3667249d034630906a64cb3915053ab7ce22ec69]
      - block_id: recall-futility
        role: recall
        concept: futility-boundary
        items:
          - question: "A two-stage trial stops at the first look for efficacy and reports a large effect. What should you distrust about that number?"
            answer: "The stopping rule selected the look that crossed, so the conditional bias in the reported effect can be substantial."
          - question: "In sequential testing you would stop at the acceptance region and report the estimate. Why does that not settle it here?"
            answer: "The stopping rule breaks the normality the standard interval assumes, so the estimate needs an interval built for repeated looks."
            cross_domain: true
          - question: "Which single fact tells you whether a futility rule in a published trial was real?"
            answer: "Whether an independent monitoring committee is reported at all, since roughly two thirds of published adaptive trials name none."

    subsections:
      - block_id: sub-futility-limits
        title: "Where this framing breaks down: the interval you report is not the one you designed"
        concept: futility-boundary
        blocks:
          - block_id: subsum-futility-limits
            role: summary
            text: "Repeated confidence intervals hold their simultaneous coverage at level one minus alpha across every interim analysis."
            claim_ids: [C-3667249d-20]
            provenance: verified
            source_ids: [3667249d034630906a64cb3915053ab7ce22ec69]
          - block_id: body-futility-limits
            role: body
            concept: futility-boundary
            mode: cost
            heading: "The standard repair is conservative, and the width is the bill"
            text: "Repeated confidence intervals are the standard repair, and they keep their simultaneous coverage across every look. They pay for that by being conservative, so the interval comes out wider than the data alone would justify. That interval is wide because the trial looked, and it is charged the width whether or not it stopped. The interval is therefore not comparable with a fixed-sample one, since the two carry different guarantees."
            claim_ids: [C-3667249d-20, C-5426dd09-15]
            # inferred: the cost framing is the author's reading of two cited coverage results
            provenance: inferred
            source_ids: [3667249d034630906a64cb3915053ab7ce22ec69, 5426dd096a626a9b4e81a8571e3c36738b087bdd]
