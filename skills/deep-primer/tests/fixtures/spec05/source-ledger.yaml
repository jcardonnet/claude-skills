# Source-ledger for spec-05-clinical-trial-design.
#
# SYNTHETIC BY CONSTRUCTION, and deliberately so. Every url is example.org and every author/venue
# is obviously fictional — the same convention as tests/fixtures/source-ledger.full.yaml, and the
# opposite of tests/fixtures/spec02/source-ledger.yaml, whose sources were fetched over the network
# and quote-verified verbatim. This ledger asserts nothing about the world; it exists so the
# STRUCTURE of a non-software primer can be exercised end to end.
#
# Quotes are <=15 words (R-GROUND-01) and lexically close to the statements they support, so the
# offline lexical entailment proxy can resolve them. C-spend-3 and C-ssr-3 are a symmetric
# contested pair (R-GROUND-05): the disagreement is visible from either source.
sources:
  - source_id: s-spend
    url: "https://example.org/error-spending-across-looks"
    title: "Error spending across interim analyses"
    authors: ["A. Statistician"]
    venue: "Example Biostatistics Review"
    date: "2025-01-20"
    type: primary_paper
    credibility: high
    provenance_origin: discovered
    retrieved_at: "2026-08-17T00:00:00Z"
    content_hash: "beef0501"
    claims:
      - claim_id: C-spend-1
        text: "each interim analysis consumes part of one fixed error budget"
        quote: "each interim analysis consumes part of one fixed error budget"
        location: "p.3 / §2"
        confidence: high
        corroboration_count: 2
        corroborated_by: [s-guide]
      - claim_id: C-spend-2
        text: "the spending shape decides how much error the final analysis keeps"
        quote: "the spending shape decides how much error the final analysis keeps"
        location: "p.6 / §4"
        confidence: high
      # the dissenting half of the C-ssr-3 disagreement; contested/contradicts are symmetric so the
      # conflict is visible from either source (R-GROUND-05)
      - claim_id: C-spend-3
        text: "unblinded re-estimation is worth its loss when variance assumptions are weak"
        quote: "unblinded re-estimation is worth its loss when variance assumptions are weak"
        location: "p.11 / §7"
        confidence: medium
        contested: true
        contradicts: [C-ssr-3]

