# Source-ledger for spec-05-clinical-trial-design.
#
# THESE SOURCES ARE REAL. Every source_id, url, title, content_hash, claim_id, claim text, quote
# and location below was produced by an actual Phase 1/1a campaign (2026-08-21) and is copied
# VERBATIM from tests/fixtures/spec05-grounded/source-ledger.yaml, which holds the full run:
# 131 documents retrieved, 30 sources extracted, 283 claims kept and 78 rejected. The 10 sources
# and 34 claims here are the claims the primer cites plus the ones that supply their corroboration
# — `corroborated_by` holds source_ids, so each corroborating claim is carried too, or the count
# would be an assertion rather than something a reader can check. The full-hex source_ids are kept
# precisely so any claim can be grepped back to the campaign output it came from.
#
# THIS IS THE RUN GAPS.md G17 IS ABOUT, so read the curation with that in mind. 37 of that run's
# 131 documents are Cloudflare "Client Challenge" interstitials and 7 more are sub-60-word cookie
# or reCAPTCHA stubs: 34% of the corpus is not a document at all, and six such sources reached the
# grounded ledger carrying 17 claims of interstitial troubleshooting text ("Ad blockers can
# interfere with website functionality") typed `primary_paper`. None of them are here. Every source
# below was opened against its retrieved text before it was kept. That check is hand-work; the
# pipeline does not do it, which is the whole content of G17.
#
# 71047f73 IS KEPT ON PURPOSE AND IS DISCLOSED. It is the EMA ICH E20 landing page — 241 words —
# not the guideline itself, so it is exactly the second and subtler failure class G17 describes: a
# depth downgrade that no length or fingerprint gate can see, because the page is genuinely about
# the topic. Most of its extracted claims are bibliographic furniture (reference numbers, adoption
# dates) presented as findings, and they are dropped. Exactly one claim survives, C-71047f73-2,
# because it restates the guideline's own scope sentence rather than page metadata. Keeping one
# usable claim from a downgraded page, and saying so, is what curation of this run actually looks
# like — deleting the source would hide the failure mode the fixture is best placed to show.
#
# FOUR DESCRIPTIVE FIELDS WERE HAND-FILLED: `credibility`, `date`, `venue` and `authors`. The run
# leaves all four empty on every source. `date` is filled only where the document evidences one:
# the two arXiv ids encode their own year and month (1803 -> 2018-03, 2605 -> 2026-05). The eight
# PMC, EMA and commercial pages carry no date we retrieved, so theirs stay null, and `authors` is
# empty everywhere because this spec declares no seed_sources and nothing in the run named one.
#
# `type` IS RUN-PRODUCED HERE, unlike what the spec-04 ledger header claims. `fetch_source_leads`
# does copy the lead's type onto the fetched document (`doc.source_type = doc.source_type or
# lead.type`, retrieval_loop.py:157), so `type` arrives populated — but it is discovery's PRE-FETCH
# guess, inherited and never observed, which is the mechanism that let interstitials be filed as
# `primary_paper`. All ten types below were re-checked against the retrieved text and all ten were
# already correct, so none were changed. That is luck, not a gate.
#
# THREE EVIDENCE-GRADING FIELDS ARE AUTHORED, and unlike the descriptive four they are judgements:
# `contested`, `contradicts`, and one `corroboration_count`/`corroborated_by` pair. `contested` and
# `contradicts` are authored ENTIRELY. `claim_extractor.mark_conflicts` exists and records
# disagreement symmetrically, but `run_campaign.py` never calls it, so no campaign has ever set
# `contested` on any claim — across four real runs the field is 0 in all of them. See GAPS.md G16.
#
# THE CONTESTED PAIR, written out so it can be disagreed with: C-07c9a426-3 says unblinded
# re-estimation exists to address uncertainty about the MAGNITUDE OF THE EFFECT SIZE, which only
# unblinded data reveal. C-e000d90c-7 reports simulations in which blinded procedures perform
# similarly to unblinded ones in many cases. These are not flat logical negations, and the ledger
# does not pretend they are: they are a disagreement about what sample-size re-estimation is FOR,
# and the boundary between them is which uncertainty dominates — nuisance variance, which blinded
# data estimate perfectly well, or treatment effect, which they cannot see. A staff-plus reader
# deciding whether to pay the regulatory cost of unblinding needs both framings side by side, which
# is why they render through `contested-graph` instead of one being asserted over the other.
#
# CORROBORATION IS ALMOST ENTIRELY RUN-PRODUCED, which is new: six of the seven links below came
# out of the campaign as three symmetric cross-source pairs (C-b42f6bdc-23/C-5426dd09-9 on bounding
# the family-wise error, C-3667249d-20/C-5426dd09-15 on repeated confidence intervals, and
# C-c013edc2-7/C-71047f73-2 on prospective planning), and every one of their corroborators is
# carried here so the count resolves. Exactly ONE link is authored — C-e000d90c-2 with
# C-b42f6bdc-9, that trial planning rests on quantities not known to the needed precision at
# protocol time — and it follows the same discipline as spec-03 and spec-04: corroboration is
# marked only across DIFFERENT organisations, because same-origin agreement is not corroboration
# (R-EVID-03). No corroboration is asserted between b42f6bdc and 64ab2594 despite their overlapping
# subject matter: the run recorded no author lists, so a shared author group could not be excluded.
#
# Quotes are <=15 words (R-GROUND-01). They are NOT lexically close to the blocks that cite them —
# R-GROUND-01 requires the prose to be a paraphrase, so the offline lexical entailment proxy scores
# them low by design. citation_quality gates `verified_recall`/`verified_precision` only when a real
# entailment backend is present; offline, only resolves_to_ledger / scoreable / ungrounded_share bind.
