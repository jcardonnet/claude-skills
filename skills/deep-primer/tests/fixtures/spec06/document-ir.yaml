# Document IR for spec-06-user-structured-eval — the G6 case: an explicit user structure governs the
# top-level outline and its ORDER, while every heading stays a predictive claim.
#
# The two rules collide head-on here. R-ARCH-07 says the user's four entries must each be realized,
# once, in order; R-SCENT-01 bans "Background" as a heading outright (it is in the banned generic
# list). They coexist ONLY through `Section.maps_to`: the mapping is declared as data, so the
# heading is free to carry information scent. Read the four sections' `maps_to` beside their
# `title` — that pairing is the whole point of this fixture.
#
# THE SOURCES ARE REAL. This fixture was re-grounded on 2026-08-21 against a Phase 1/1a campaign
# (76 min, $5.05, 116 documents fetched, 30 extracted, 343 claims kept, 87 concepts grouped) whose
# raw output is committed under tests/fixtures/spec06-grounded/. Every claim_id and source_id below
# resolves to source-ledger.yaml, and that ledger's header records exactly which fields were hand-
# filled at curation time and why. The four concepts were PINNED by `user_structure` BEFORE the
# campaign ran, so this fixture now tests structure AND grounding at once: the outline was chosen up
# front and the evidence had to either confirm it or break it. All four concepts survived. One alias
# did not — see concept-map.yaml on why `groundedness` is no longer a synonym for `faithfulness`.
meta:
  parameters:
    home_domain: ["ML engineering"]
    target_domain: "evaluation of retrieval-augmented systems"
    seniority_band: mid_senior
    # The SPEC asks for 4500 words; this is the compact reference realisation of the same contract,
    # so meta records the budget it was actually drafted to and R-ARCH-06 bands off that number.
    # Same convention as document-ir.full.yaml (260 against a 6000-word spec) and
    # tests/fixtures/spec02/document-ir.yaml (430 against 8000).
    length_budget: 850
    outputs: [html, llm_md]
    # R-ARCH-07 only binds when this is present — user_structure_respected returns [] without it,
    # so an artifact that dropped it would pass the rule vacuously.
    user_structure:
      - "Background"
      - "Metrics that matter"
      - "Tooling"
      - "Open problems"
