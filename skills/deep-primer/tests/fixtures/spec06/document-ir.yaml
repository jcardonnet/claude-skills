        title: "The routes out of drift disagree about what ground truth even is"
        concept: eval-set-drift
        blocks:
          - block_id: subsum-drift-groundtruth
            role: summary
            text: "One route regenerates the eval set from the knowledge base; the other refuses synthetic data and uses validated business answers."
          - block_id: body-drift-groundtruth
            role: body
            mode: failure
            concept: eval-set-drift
            heading: "Regenerate the set, or refuse to"
            text: "Synthetic generation can build question-and-answer triplets with their context, straight from the knowledge base, so the eval set is rebuilt with the corpus. That generation keeps pace with drift by construction, which is one position. The opposing position holds that the optimal ground truth for enterprise RAG is institutionally validated business answers, not a synthetic dataset. That position trades freshness for authority, and neither side carries a settled refresh cadence."
            claim_ids: [C-4833d8ca-6, C-22c548bc-20]
