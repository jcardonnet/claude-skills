# Document IR for spec-06-user-structured-eval — the G6 case: an explicit user structure governs the
# top-level outline and its ORDER, while every heading stays a predictive claim.
#
# The two rules collide head-on here. R-ARCH-07 says the user's four entries must each be realized,
# once, in order; R-SCENT-01 bans "Background" as a heading outright (it is in the banned generic
# list). They coexist ONLY through `Section.maps_to`: the mapping is declared as data, so the
# heading is free to carry information scent. Read the four sections' `maps_to` beside their
# `title` — that pairing is the whole point of this fixture.
#
# The sources are SYNTHETIC (example.org, fictional authors) — see source-ledger.yaml. This artifact
# exercises structure, not grounding.
meta:
  parameters:
    home_domain: ["ML engineering"]
    target_domain: "evaluation of retrieval-augmented systems"
    seniority_band: mid_senior
    # The SPEC asks for 4500 words; this is the compact reference realisation of the same contract,
    # so meta records the budget it was actually drafted to and R-ARCH-06 bands off that number.
    # Same convention as document-ir.full.yaml (260 against a 6000-word spec) and
    # tests/fixtures/spec02/document-ir.yaml (430 against 8000).
    length_budget: 850
    outputs: [html, llm_md]
    # R-ARCH-07 only binds when this is present — user_structure_respected returns [] without it,
    # so an artifact that dropped it would pass the rule vacuously.
    user_structure:
      - "Background"
      - "Metrics that matter"
      - "Tooling"
      - "Open problems"
  ledger_snapshot: [s-attrib, s-metric, s-judge, s-drift]
  model_versions: {generator: test-fixture, verifier: lexical}
  generated_at: "2026-08-18T00:00:00Z"

sections:
  # entry 1 of the user structure. "Background" is a BANNED heading (R-SCENT-01), so the mapping is
  # declared here and the title carries the claim instead.
  - block_id: sec-attrib
    title: "One end-to-end score hides which stage of the pipeline broke"
    maps_to: "Background"
    concept: failure-attribution
    blocks:
      - block_id: lede-attrib
        role: lede
        text: "Failure attribution splits an end-to-end score into a retrieval score and a generation score. Each score then has its own ground truth, so a regression points at one stage rather than at the whole system."
        claim_ids: [C-attr-1, C-attr-2]
        provenance: verified
        source_ids: [s-attrib]
      - block_id: card-attrib
        role: card
        concept: failure-attribution
        mode: mental_model
        claim_ids: [C-attr-2, C-attr-3]
        provenance: verified
        source_ids: [s-attrib]
        row_claims:
          idea: [C-attr-2]
          key_exemplar: [C-attr-3]
        rows:
          idea: "Score retrieval and generation against separate ground truth, because only one stage is usually broken."
          home_anchor: "Like ablating one stage of a training pipeline to see which stage owns the loss."
          whats_new_vs_renamed: "Stage-wise ablation is renamed; what is new is that each stage needs a different kind of label."
          reach_for_when: "Reach for stage-wise scores the moment an aggregate number moves and nobody can say why."
          skip_when: "Skip the split when the context is fixed by construction and only the generator can vary."
          key_exemplar: "Recall@k measured with no generator in the loop, then answer quality measured separately."
          confidence: "settled that the stages fail independently; contested how to weight them into one number"
      - block_id: matrix-attrib
        role: matrix
        artifact_kind: decision_matrix
        mode: tradeoff
        concept: failure-attribution
        text: "Baseline: label a small query set with the passages that answer it, then score the two stages apart. Human labels buy trust at the cost of throughput; reference-free judging buys coverage at the cost of a judge you must validate first. Questions generated from the corpus buy volume at the cost of matching the corpus rather than your users."
        claim_ids: [C-attr-2]
        # inferred, not verified: the baseline recommendation and the three-way cost comparison are
        # synthesis GROUNDED IN the source rather than stated by it.
        provenance: inferred
        source_ids: [s-attrib]
      - block_id: fig-attrib
        role: figure
        concept: failure-attribution
        mode: architecture
        caption: "Figure 1: retrieval error and generation error enter the same final score, so the aggregate moves without naming a cause."
        svg_ref: "assets/failure-attribution.svg"
      - block_id: recall-attrib
        role: recall
        claim_ids: [C-attr-3]
        provenance: verified
        source_ids: [s-attrib]
        items:
          - question: "Your aggregate score drops four points the morning after a corpus refresh. What do you measure first?"
            answer: "Retrieval recall against the labelled passages, because a refresh moves retrieval before it moves generation."
            claim_ids: [C-attr-3]
          - question: "Which training-pipeline habit does stage-wise scoring correspond to?"
            answer: "Ablating one stage at a time, so the loss is attributed rather than averaged away."
            cross_domain: true
          - question: "When does splitting the score buy you nothing?"
            answer: "When the retrieved context is fixed by construction, leaving the generator as the only stage that can vary."

    subsections:
      - block_id: sub-attrib-recall
        title: "Recall@k moves before the aggregate does"
        concept: failure-attribution
        blocks:
          - block_id: subsum-attrib-recall
            role: summary
            text: "Retrieval is measurable with no generator in the loop, which makes it the cheaper half to instrument first."
          - block_id: body-attrib-recall
            role: body
            mode: failure
            concept: failure-attribution
            heading: "Where the aggregate goes quiet"
            text: "An aggregate score stays flat when a retrieval loss and a generation gain cancel. That score is usually the only number a team watches, so the cancellation never surfaces. That cancellation becomes visible once recall@k is plotted beside the aggregate. Recall@k needs no generator, so it costs one retrieval pass over a labelled query set. That pass is cheap enough to run on every corpus rebuild."
            claim_ids: [C-attr-1, C-attr-3]
            provenance: inferred
            source_ids: [s-attrib]

      - block_id: sub-attrib-labels
        title: "The labelled query set is the asset; the metric is downstream of it"
        concept: failure-attribution
        blocks:
          - block_id: subsum-attrib-labels
            role: summary
            text: "Every retrieval metric needs passages marked relevant, and that labelling is the work most teams skip."
          - block_id: body-attrib-labels
            role: body
            mode: cost
            concept: failure-attribution
            heading: "Why the label set outlives the metric"
            text: "A labelled query set names, for each question, the passages that actually answer it. Those passages are what recall@k and precision@k are computed against. The same passages become the answer key for judging a hallucination in the generated text. That key is expensive in annotator hours, and no framework removes the expense. A framework matters less than the label quality underneath it."
            claim_ids: [C-attr-2]
            provenance: inferred
            source_ids: [s-attrib]

  # entry 2. The label is not banned, but copying it would still be a topic label with no scent.
  - block_id: sec-faith
    title: "Faithfulness and answer relevance move apart, so one averaged score buries both"
    maps_to: "Metrics that matter"
    concept: faithfulness
    blocks:
      - block_id: lede-faith
        role: lede
        text: "Faithfulness asks whether an answer is entailed by the retrieved context, and relevance asks whether the answer addresses the question. An answer can satisfy either property alone, so the two scores move apart and an average destroys the signal."
        claim_ids: [C-faith-1]
        provenance: verified
        source_ids: [s-metric]
      - block_id: card-faith
        role: card
        concept: faithfulness
        mode: mental_model
        claim_ids: [C-faith-1, C-faith-2]
        provenance: verified
        source_ids: [s-metric]
        row_claims:
          idea: [C-faith-1]
          key_exemplar: [C-faith-1]
        rows:
          idea: "Faithfulness scores the answer against the context; relevance scores it against the question."
          home_anchor: "Like reporting precision and recall separately rather than collapsing them into accuracy."
          whats_new_vs_renamed: "The two-axis habit is renamed; what is new is that the reference is retrieved per query, not held out once."
          reach_for_when: "Reach for both axes whenever the generator can answer well from the wrong passage."
          skip_when: "Skip faithfulness on an extractive task, where the answer is copied out of the context."
          key_exemplar: "A fluent answer entailed by nothing retrieved: high on relevance, near zero on faithfulness."
          confidence: "settled that the axes are separable; contested how either is measured at scale"
      - block_id: matrix-faith
        role: matrix
        artifact_kind: failure_catalog
        mode: failure
        concept: faithfulness
        text: "Confident synthesis: the generator answers from parameters while the retrieved context says nothing. Context echo: the answer is perfectly faithful to a passage that never addresses the question. Partial support: half the answer is entailed, and a binary score reports the whole answer as unfaithful."
        claim_ids: [C-faith-3]
        provenance: inferred
        source_ids: [s-metric]
      - block_id: toulmin-faith
        role: toulmin
        concept: faithfulness
        mode: tradeoff
        text: "When a generator can produce fluent text from parameters alone, score faithfulness apart from relevance. Qualifier: faithfulness stops discriminating once retrieval precision is high, because almost every answer is then entailed. Rebuttal: on an extractive task the answer is copied from context, so faithfulness sits near one by construction and measures nothing."
        claim_ids: [C-faith-1, C-faith-2]
        provenance: inferred
        source_ids: [s-metric]
      - block_id: fig-faith
        role: figure
        concept: faithfulness
        mode: benchmark
        caption: "Figure 2: as retrieval precision rises, faithfulness saturates near one while answer relevance keeps discriminating."
        svg_ref: "assets/faithfulness-relevance.svg"
      - block_id: recall-faith
        role: recall
        items:
          - question: "An answer scores high on relevance and low on faithfulness. What happened?"
            answer: "The generator answered from parameters, so nothing in the retrieved context entails the answer."
          - question: "Which two-number habit from classification carries over here?"
            answer: "Reporting precision and recall apart, because one aggregate hides which of the two actually moved."
            cross_domain: true
          - question: "Why does faithfulness stop discriminating on a high-precision retriever?"
            answer: "Nearly every answer is then entailed by its context, so the score piles up near one."

    subsections:
      - block_id: sub-faith-binary
        title: "A binary faithfulness label throws away the half-supported answer"
        concept: faithfulness
        blocks:
          - block_id: subsum-faith-binary
            role: summary
            text: "Most wrong answers are partly entailed, so a yes-or-no verdict loses the thing worth fixing."
          - block_id: body-faith-binary
            role: body
            concept: faithfulness
            heading: "Claim-level scoring keeps the diagnosis"
            text: "A binary faithfulness label collapses a mixed answer into one verdict. That verdict hides which sentence of the answer failed, so the scoring gives you nothing to fix. Claim-level scoring splits the answer into atomic statements and checks each one against the context. Each statement then carries its own verdict, and the unsupported ones name the repair."
            claim_ids: [C-faith-3]
            provenance: inferred
            source_ids: [s-metric]

  # entry 3.
  - block_id: sec-judge
    title: "Every eval framework ships a judge you have not validated yet"
    maps_to: "Tooling"
    concept: judge-calibration
    blocks:
      - block_id: lede-judge
        role: lede
        text: "Judge calibration measures an eval framework's model against human labels on a held-out set. Without that calibration a framework reports numbers whose error rate nobody knows."
        claim_ids: [C-judge-1]
        provenance: verified
        source_ids: [s-judge]
      - block_id: card-judge
        role: card
        concept: judge-calibration
        mode: mental_model
        claim_ids: [C-judge-1, C-judge-2]
        provenance: verified
        source_ids: [s-judge]
        row_claims:
          idea: [C-judge-1]
          key_exemplar: [C-judge-2]
        rows:
          idea: "A judge model is a classifier, so it has a true positive rate you have not measured."
          home_anchor: "Like holding out a labelled split before a classifier is allowed to gate anything."
          whats_new_vs_renamed: "Held-out validation is renamed; what is new is that the classifier is a prompt anyone can edit."
          reach_for_when: "Reach for calibration before a judge score reaches a dashboard or a release gate."
          skip_when: "Skip it when the criterion is decidable in code, where an exact match already answers."
          key_exemplar: "A hundred human-labelled traces, split into a develop half and a test half."
          confidence: "settled that judges need validation; contested how many labels are enough"
      - block_id: matrix-judge
        role: matrix
        artifact_kind: decision_aid
        mode: cost
        concept: judge-calibration
        text: "Below fifty human labels, treat a judge score as a smoke test and gate nothing on it. Between fifty and two hundred, report the judge's true positive and true negative rates beside every number it produces. Above two hundred, correct the raw judge rate for those two error rates and gate on the corrected estimate."
        claim_ids: [C-judge-2]
        provenance: inferred
        source_ids: [s-judge]
      - block_id: fig-judge
        role: figure
        concept: judge-calibration
        mode: benchmark
        caption: "Figure 3: a judge at ninety percent true positive rate shifts the reported pass rate by several points."
        svg_ref: "assets/judge-calibration.svg"
      - block_id: recall-judge
        role: recall
        items:
          - question: "Your judge reports eighty percent faithful. What is missing before that number ships?"
            answer: "The judge's own true positive and true negative rates, measured on human-labelled traces."
          - question: "What does judge calibration correspond to in a supervised training workflow?"
            answer: "Holding out a labelled test split, because a scorer fitted on everything reports its own optimism."
            cross_domain: true
          - question: "When is calibrating a judge wasted effort?"
            answer: "When the criterion is decidable in code, where an exact match is already the ground truth."

    subsections:
      - block_id: sub-judge-prompt
        title: "Editing the judge prompt retires every score above it"
        concept: judge-calibration
        blocks:
          - block_id: subsum-judge-prompt
            role: summary
            text: "A judge prompt is a model version, so editing it retires the calibration measured against the old one."
          - block_id: body-judge-prompt
            role: body
            mode: failure
            concept: judge-calibration
            heading: "Silent drift in the scorer itself"
            text: "A judge prompt gets edited far more often than a checkpoint gets replaced, and each edit is a version change. That edit retires the calibration measured against the previous prompt. A calibration that nobody retires is the one people trust longest. Version the prompt beside the code, then measure agreement again after every edit."
            claim_ids: [C-judge-3]
            provenance: inferred
            source_ids: [s-judge]

  # entry 4, and the shortest section — salience, not uniform padding (R-ARCH-06).
  - block_id: sec-drift
    title: "A frozen eval set stops measuring the system once the corpus moves"
    maps_to: "Open problems"
    concept: eval-set-drift
    blocks:
      - block_id: lede-drift
        role: lede
        text: "An eval set is frozen against a corpus that keeps changing underneath it. That corpus gains documents and retires others, so eval set drift opens between the score and the system."
        claim_ids: [C-drift-1]
        provenance: verified
        source_ids: [s-drift]
      - block_id: card-drift
        role: card
        concept: eval-set-drift
        mode: mental_model
        claim_ids: [C-drift-1, C-drift-2]
        provenance: verified
        source_ids: [s-drift]
        row_claims:
          idea: [C-drift-1]
          key_exemplar: [C-drift-2]
        rows:
          idea: "An eval set measures the corpus it was labelled against, not the corpus you serve today."
          home_anchor: "Like training-serving skew, where the feature distribution moves after the model is fit."
          whats_new_vs_renamed: "Distribution shift is renamed; what is new is that a label is a pointer, so an ingest can delete it."
          reach_for_when: "Reach for a refresh policy the first time a corpus rebuild moves a score you did not touch."
          skip_when: "Skip refreshing when the corpus is a fixed archive, where the labels cannot go stale."
          key_exemplar: "A relevance label pointing at a passage that the last ingest deleted."
          confidence: "contested: no settled refresh cadence has been established"
      - block_id: checklist-drift
        role: matrix
        artifact_kind: checklist
        text: "Re-resolve every labelled passage pointer after each ingest. Record the corpus snapshot identifier beside every score. Re-label a sampled slice on a fixed cadence rather than all at once. Refuse to compare two scores taken against different snapshots."
        claim_ids: [C-drift-2]
        provenance: inferred
        source_ids: [s-drift]
      - block_id: fig-drift
        role: figure
        concept: eval-set-drift
        mode: historical
        caption: "Figure 4: the reported score holds steady across rebuilds while the fraction of resolvable labels falls."
        svg_ref: "assets/eval-set-drift.svg"
      - block_id: recall-drift
        role: recall
        items:
          - question: "A nightly ingest ran and your eval score improved by three points. What do you check?"
            answer: "How many labelled passages still resolve, because a deleted passage can flatter recall rather than raise it."
          - question: "Which production monitoring problem has the same shape?"
            answer: "Training-serving skew, where the data moves after the model was fit and nobody refits it."
            cross_domain: true
          - question: "Why is a refresh cadence still an open problem?"
            answer: "Re-labelling costs annotator time, and no result says how much staleness a score can absorb."

    subsections:
      - block_id: sub-drift-pointer
        title: "Relevance labels are pointers, and pointers dangle"
        concept: eval-set-drift
        blocks:
          - block_id: subsum-drift-pointer
            role: summary
            text: "A relevance label names a passage by identifier, so an ingest that re-chunks the corpus can orphan it."
          - block_id: body-drift-pointer
            role: body
            mode: failure
            concept: eval-set-drift
            heading: "The dangling label problem"
            text: "A relevance label points at a passage identifier rather than at text. That identifier is rewritten whenever an ingest re-chunks the document. A changed identifier raises no error, so the label silently leaves the recall denominator. Recall then rises, because the questions nobody could answer have quietly left the set."
            claim_ids: [C-drift-2]
            provenance: inferred
            source_ids: [s-drift]
