sections:
  # entry 1 of the user structure. "Background" is a BANNED heading (R-SCENT-01), so the mapping is
  # declared here and the title carries the claim instead.
  - block_id: sec-attrib
    title: "One end-to-end score hides which stage of the pipeline broke"
    maps_to: "Background"
    concept: failure-attribution
    blocks:
      - block_id: lede-attrib
        role: lede
        text: "A RAG pipeline exposes the retriever and the generator as two distinct failure surfaces, each inspectable on its own. That pipeline still reports one end-to-end number, and when it fails the number does not say which of the two surfaces is responsible."
        claim_ids: [C-a29027ab-21, C-4833d8ca-4]
        provenance: verified
        source_ids:
          - a29027abc40701b6c95f56ba68f05e055a4bbe6e
          - 4833d8ca9fe6f7f7fa403755fbb328a96de31328
      - block_id: card-attrib
        role: card
        concept: failure-attribution
        mode: mental_model
        claim_ids: [C-a29027ab-21, C-a29027ab-10, C-56cc8dbe-17, C-56cc8dbe-18]
        provenance: verified
        source_ids:
          - a29027abc40701b6c95f56ba68f05e055a4bbe6e
          - 56cc8dbef6959bc63ad65aa215bf902b18446cdb
        row_claims:
          idea: [C-a29027ab-21]
          reach_for_when: [C-a29027ab-10]
          key_exemplar: [C-56cc8dbe-17, C-56cc8dbe-18]
        rows:
          idea: "Score the retriever and the generator against separate ground truth, because they are two distinct failure surfaces."
          home_anchor: "Like ablating one stage of a training pipeline to see which stage owns the loss."
          whats_new_vs_renamed: "Stage-wise ablation is renamed; what is new is that each stage needs a different kind of label."
          reach_for_when: "Reach for stage-wise scores when component metrics look healthy and end-to-end quality is collapsing anyway."
          skip_when: "Skip the split when the retrieved context is fixed by construction and only the generator can vary."
          key_exemplar: "RAGEC classifies a failure by stage before naming the error type, agreeing with human annotators 57.8 percent of the time."
          confidence: "settled that the surfaces are distinct; the automatic stage classifiers are nowhere near reliable"
      - block_id: matrix-attrib
        role: matrix
        artifact_kind: decision_matrix
        mode: tradeoff
        concept: failure-attribution
        text: "Two surfaces is the cheap model and it holds for a plain retriever-generator pipeline. Four stages — chunking, retrieval, reranking, generation — is the accurate model, and it costs one labelled artifact per boundary. An automatic stage classifier costs nothing per query and reaches 57.8 percent agreement on stage and 40.3 percent on error type, so it ranks candidates rather than settling them. Agentic pipelines force the finer model, because one retrieval error there cascades across later tool calls."
        claim_ids: [C-56cc8dbe-4, C-56cc8dbe-18, C-56cc8dbe-19, C-4833d8ca-8]
        # inferred, not verified: the three-way cost comparison and the "ranks rather than settles"
        # reading of the agreement numbers are synthesis GROUNDED IN the sources, not stated by them.
        provenance: inferred
        source_ids:
          - 56cc8dbef6959bc63ad65aa215bf902b18446cdb
          - 4833d8ca9fe6f7f7fa403755fbb328a96de31328
      - block_id: fig-attrib
        role: figure
        concept: failure-attribution
        mode: architecture
        caption: "Figure 1: retrieval error and generation error enter the same end-to-end score, so component metrics can read healthy while that score collapses."
        svg_ref: "assets/failure-attribution.svg"
      - block_id: recall-attrib
        role: recall
        claim_ids: [C-a29027ab-10, C-4833d8ca-8]
        provenance: verified
        source_ids:
          - a29027abc40701b6c95f56ba68f05e055a4bbe6e
          - 4833d8ca9fe6f7f7fa403755fbb328a96de31328
        items:
          - question: "Every component metric reads healthy and end-to-end quality has collapsed anyway. What does that pattern tell you?"
            answer: "That component health and end-to-end quality can diverge, so the aggregate has to be attributed to a stage rather than trusted."
            claim_ids: [C-a29027ab-10]
          - question: "Which training-pipeline habit does stage-wise scoring correspond to?"
            answer: "Ablating one stage at a time, so the loss is attributed rather than averaged away."
            cross_domain: true
          - question: "Why does an agentic pipeline make attribution harder rather than easier?"
            answer: "One retrieval error there cascades across later tool calls, so the visible failure sits several steps from its cause."
            claim_ids: [C-4833d8ca-8]

    subsections:
      - block_id: sub-attrib-blackbox
        title: "Benchmarks were built for one stage or the other, not for the join"
        concept: failure-attribution
        blocks:
          - block_id: subsum-attrib-blackbox
            role: summary
            text: "The benchmarks you would reach for were built to score retrieval or generation in isolation, not the join between them."
          - block_id: body-attrib-blackbox
            role: body
            mode: failure
            concept: failure-attribution
            heading: "Where the black box goes quiet"
            text: "A RAG system treated as a black box hides where its retrieval and generation errors originate. That system reports metrics that mislead rather than metrics that are merely imprecise. Those metrics inherit the problem from the benchmarks beneath them, most of which were built to evaluate retrieval or generation in isolation. Metrics calibrated for this pipeline are what make failure attribution possible at all. Those metrics separate a retrieval error from a generation error, which makes the metric definition a design decision rather than a reporting choice."
            claim_ids: [C-964231ec-15, C-964231ec-23, C-964231ec-24]
            provenance: inferred
            source_ids:
              - 964231ec57389834e9f89b5a447be2e968a39342

      - block_id: sub-attrib-surfaces
        title: "Fine-tuning buys quality by removing the surface you debug on"
        concept: failure-attribution
        blocks:
          - block_id: subsum-attrib-surfaces
            role: summary
            text: "Knowledge folded into model weights leaves no retrieval step for a production failure to be traced back to."
          - block_id: body-attrib-surfaces
            role: body
            mode: cost
            concept: failure-attribution
            heading: "What the two surfaces are worth"
            text: "A fine-tuned model folds what a retriever would have supplied into its own weights. That model leaves no retrievable error source behind when the pipeline fails in production. A RAG pipeline keeps both surfaces addressable instead, and pays for that with a label set per boundary. The pipeline has four such boundaries — chunking, retrieval, reranking, generation — and production systems add more."
            claim_ids: [C-a29027ab-22, C-56cc8dbe-1, C-56cc8dbe-4]
            provenance: inferred
            source_ids:
              - a29027abc40701b6c95f56ba68f05e055a4bbe6e
              - 56cc8dbef6959bc63ad65aa215bf902b18446cdb

  # entry 2 of the user structure.
  - block_id: sec-faith
    title: "Faithfulness and answer relevance move apart, so one averaged score buries both"
    maps_to: "Metrics that matter"
    concept: faithfulness
    blocks:
      - block_id: lede-faith
        role: lede
        text: "Faithfulness asks whether an answer is grounded in and inferable from the retrieved context. Faithfulness is one of four core metrics, beside answer relevance, plus context precision and context recall. Answer relevance is the one people confuse it with, and it measures only whether the response addresses the question asked."
        claim_ids: [C-8ee2ad4d-4, C-22c548bc-1, C-8ee2ad4d-5]
        provenance: verified
        source_ids:
          - 8ee2ad4d316a9893170f5726fd67893be4787918
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
      - block_id: card-faith
        role: card
        concept: faithfulness
        mode: mental_model
        claim_ids: [C-8ee2ad4d-4, C-22c548bc-5, C-8ee2ad4d-3, C-e0cec4fc-5, C-e0cec4fc-6, C-e0cec4fc-13]
        provenance: verified
        source_ids:
          - 8ee2ad4d316a9893170f5726fd67893be4787918
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
          - e0cec4fc48ec1fc278bf0857885da3042409ccdf
        row_claims:
          idea: [C-8ee2ad4d-4]
          reach_for_when: [C-8ee2ad4d-3]
          key_exemplar: [C-e0cec4fc-5, C-e0cec4fc-6]
        rows:
          idea: "Faithfulness scores an answer against its retrieved context; answer relevance scores it against the question."
          home_anchor: "Like reporting precision and recall separately rather than collapsing them into accuracy."
          whats_new_vs_renamed: "The two-axis habit is renamed; what is new is that the reference is retrieved per query, not held out once."
          reach_for_when: "Reach for both axes when no human-annotated ground truth exists, which is the case RAGAS was built for."
          skip_when: "Skip faithfulness on an extractive task, where the answer is copied out of the context."
          key_exemplar: "LangChain ships correctness, relevance and groundedness as separate evaluators, and only correctness needs a reference answer."
          confidence: "settled that the axes are separable; the boundary between faithfulness and groundedness is not"
      - block_id: matrix-faith
        role: matrix
        artifact_kind: failure_catalog
        mode: failure
        concept: faithfulness
        text: "Confident synthesis: the generator answers from parameters while the context supports nothing, and a stronger model makes the failure more convincing rather than rarer. Context echo: the response aligns closely with a retrieved document that never addressed the question. Boundary creep: the answer stays inside what the context supports for most sentences and steps outside it on one. Partial support: half the answer is entailed, and a single verdict reports the whole answer as unfaithful."
        claim_ids: [C-22c548bc-6, C-e0cec4fc-7, C-a29027ab-11]
        # inferred: the four-way catalog is synthesis over the sources' separate observations.
        provenance: inferred
        source_ids:
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
          - e0cec4fc48ec1fc278bf0857885da3042409ccdf
          - a29027abc40701b6c95f56ba68f05e055a4bbe6e
      - block_id: toulmin-faith
        role: toulmin
        mode: tradeoff
        concept: faithfulness
        text: "Claim: score faithfulness and groundedness against separate thresholds — flag below 0.80 groundedness, block below 0.70 faithfulness. Warrant: the two thresholds measure different properties, whether a response stays inside what the context supports and whether it represents what those documents say. Rebuttal: faithfulness in RAGAS is defined as grounded in and inferable from retrieved context, which collapses the distinction. That distinction is what a published threshold assumes, so a team on the RAGAS definition has one score and two bars."
        claim_ids: [C-a29027ab-18, C-a29027ab-11, C-a29027ab-12, C-8ee2ad4d-4]
        provenance: inferred
        source_ids:
          - a29027abc40701b6c95f56ba68f05e055a4bbe6e
          - 8ee2ad4d316a9893170f5726fd67893be4787918
      - block_id: fig-faith
        role: figure
        concept: faithfulness
        mode: benchmark
        caption: "Figure 2: faithfulness scores an answer against its retrieved context while answer relevance scores it against the question."
        svg_ref: "assets/faithfulness-relevance.svg"
      - block_id: recall-faith
        role: recall
        claim_ids: [C-e0cec4fc-5, C-e0cec4fc-13, C-22c548bc-6]
        provenance: verified
        source_ids:
          - e0cec4fc48ec1fc278bf0857885da3042409ccdf
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
        items:
          - question: "An evaluator scores a response with no reference answer available. Which property can it still be measuring?"
            answer: "Groundedness, which is assessed against the retrieved documents; only correctness needs a reference answer in the dataset."
            claim_ids: [C-e0cec4fc-5, C-e0cec4fc-13]
          - question: "Which two-number habit from classification carries over here?"
            answer: "Reporting precision and recall apart, because one aggregate hides which of the two actually moved."
            cross_domain: true
          - question: "Why does a stronger generator not shrink your faithfulness problem?"
            answer: "More powerful models produce more convincing hallucinations, so the failures get harder to spot rather than rarer."
            claim_ids: [C-22c548bc-6]

    subsections:
      - block_id: sub-faith-split
        title: "Faithfulness and groundedness are one word in one framework and two in another"
        concept: faithfulness
        blocks:
          - block_id: subsum-faith-split
            role: summary
            text: "Two frameworks draw the line between the terms in different places, so the metric name alone does not say what was measured."
          - block_id: body-faith-split
            role: body
            concept: faithfulness
            heading: "One word, two definitions"
            text: "Faithfulness and groundedness name two different properties in one framework and one property in another. Groundedness measures whether a generated response stays within the boundaries of what its retrieved context supports. Faithfulness measures something adjacent, whether a response accurately represents what the retrieved documents actually say. Groundedness heads one of three LangChain evaluators, beside correctness and relevance, and only correctness needs a reference answer. Faithfulness is also the RAGAS name for that first property, so one word carries two definitions."
            claim_ids: [C-a29027ab-11, C-a29027ab-12, C-e0cec4fc-5, C-e0cec4fc-6, C-e0cec4fc-7, C-8ee2ad4d-4]
            provenance: inferred
            source_ids:
              - a29027abc40701b6c95f56ba68f05e055a4bbe6e
              - e0cec4fc48ec1fc278bf0857885da3042409ccdf
              - 8ee2ad4d316a9893170f5726fd67893be4787918

  # entry 3 of the user structure.
  - block_id: sec-judge
    title: "Every eval framework ships a judge you have not validated yet"
    maps_to: "Tooling"
    concept: judge-calibration
    blocks:
      - block_id: lede-judge
        role: lede
        text: "LLM-as-a-judge has become a prominent RAG evaluation metric over roughly the last year. A judge model rates each response against specific criteria such as faithfulness and relevance. That judge has been demonstrated to produce reasonable correlation with human judgment. That judge still needs periodic human spot checks, to verify that automated scores align with actual output quality."
        claim_ids: [C-92827b86-1, C-22c548bc-17, C-92827b86-2, C-22c548bc-19]
        provenance: verified
        source_ids:
          - 92827b864473aa65d35ecae7c7d363ee655e6b8f
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
      - block_id: card-judge
        role: card
        concept: judge-calibration
        mode: mental_model
        claim_ids: [C-22c548bc-17, C-22c548bc-19, C-4122c4ed-3, C-4122c4ed-7]
        provenance: verified
        source_ids:
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
          - 4122c4ed8a779f447f9bc1371ff7954477d8beee
        row_claims:
          idea: [C-22c548bc-17]
          reach_for_when: [C-22c548bc-19]
          key_exemplar: [C-4122c4ed-3, C-4122c4ed-7]
        rows:
          idea: "A judge model scores against criteria, so it has an agreement rate with humans that you have not measured."
          home_anchor: "Like holding out a labelled split before a classifier is allowed to gate anything."
          whats_new_vs_renamed: "Held-out validation is renamed; what is new is that the classifier is a prompt anyone can edit."
          reach_for_when: "Reach for calibration before a judge score reaches a dashboard, then keep periodic human spot checks after it does."
          skip_when: "Skip it when the criterion is decidable in code, where an exact match already answers."
          key_exemplar: "On TREC 2024 support assessment, GPT-4o and human judges agreed perfectly 56 percent of the time."
          confidence: "settled that judges need validation; the published agreement numbers are lower than the adoption suggests"
      - block_id: matrix-judge
        role: matrix
        artifact_kind: decision_aid
        mode: cost
        concept: judge-calibration
        text: "No human labels: treat a judge score as a smoke test, because its agreement with humans on your data is unmeasured. A few hundred labels: that is what ARES asks for, and it spends them on prediction-powered inference to correct the judge's own prediction errors. Same budget, better protocol: humans post-editing GPT-4o output reached 72 percent agreement against 56 percent for labelling from scratch. Recurring budget: finetune a lightweight judge on synthetic training data, which is what ARES does rather than pay a frontier model per query."
        claim_ids: [C-96072ac0-5, C-96072ac0-3, C-96072ac0-2, C-4122c4ed-3, C-4122c4ed-4]
        provenance: inferred
        source_ids:
          - 96072ac0a9442594589eacb8b5f43e8fad807de1
          - 4122c4ed8a779f447f9bc1371ff7954477d8beee
      - block_id: fig-judge
        role: figure
        concept: judge-calibration
        mode: benchmark
        caption: "Figure 3: human and GPT-4o agreement on TREC 2024 support assessment, 56 percent from scratch and 72 percent after human post-editing."
        svg_ref: "assets/judge-calibration.svg"
      - block_id: recall-judge
        role: recall
        claim_ids: [C-92827b86-2, C-4122c4ed-3, C-4122c4ed-4]
        provenance: verified
        source_ids:
          - 92827b864473aa65d35ecae7c7d363ee655e6b8f
          - 4122c4ed8a779f447f9bc1371ff7954477d8beee
        items:
          - question: "Your framework reports eighty percent faithful. What is missing before that number gates a release?"
            answer: "The judge's own agreement rate on your data, which a demonstrated correlation with human judgment does not supply."
            claim_ids: [C-92827b86-2]
          - question: "What does judge calibration correspond to in a supervised training workflow?"
            answer: "Holding out a labelled test split, because a scorer fitted on everything reports its own optimism."
            cross_domain: true
          - question: "Human labels are expensive. Which protocol buys the most agreement per hour?"
            answer: "Post-editing the judge's predictions rather than labelling from scratch, which moved agreement from 56 to 72 percent."
            claim_ids: [C-4122c4ed-3, C-4122c4ed-4]

    subsections:
      - block_id: sub-judge-ceiling
        title: "The judge agreed with the model more than the humans agreed with each other"
        concept: judge-calibration
        blocks:
          - block_id: subsum-judge-ceiling
            role: summary
            text: "An independent human judge correlated better with GPT-4o than with the other human, which caps what agreement can mean."
          - block_id: body-judge-ceiling
            role: body
            mode: failure
            concept: judge-calibration
            heading: "The ceiling is human disagreement"
            text: "An independent human judge's assessments correlated better with GPT-4o than another human judge's assessments did. Those assessments do not make the model a better judge than a person. The judge is capped by human disagreement instead, because two people scoring the same assessment already differ. Disagreement is not uniform, since RAGAS annotators agreed about 95 percent of the time on faithfulness and 90 percent on answer relevance."
            claim_ids: [C-4122c4ed-5, C-8ee2ad4d-13]
            provenance: inferred
            source_ids:
              - 4122c4ed8a779f447f9bc1371ff7954477d8beee
              - 8ee2ad4d316a9893170f5726fd67893be4787918

  # entry 4, and the shortest section — salience, not uniform padding (R-ARCH-06).
  - block_id: sec-drift
    title: "A frozen eval set stops measuring the system once the corpus moves"
    maps_to: "Open problems"
    concept: eval-set-drift
    blocks:
      - block_id: lede-drift
        role: lede
        text: "Enterprise documents evolve continuously underneath the retriever, which makes a static test set outdated quickly. The retriever is structurally blind to that staleness. That retriever keeps returning its usual numbers, so the eval measures a corpus that no longer exists."
        claim_ids: [C-4833d8ca-5, C-d82e8275-13]
        provenance: verified
        source_ids:
          - 4833d8ca9fe6f7f7fa403755fbb328a96de31328
          - d82e8275aa9034f305abcdf1d441e96e56b022db
      - block_id: card-drift
        role: card
        concept: eval-set-drift
        mode: mental_model
        claim_ids: [C-4833d8ca-5, C-d82e8275-13, C-4044d111-3, C-22c548bc-2]
        provenance: verified
        source_ids:
          - 4833d8ca9fe6f7f7fa403755fbb328a96de31328
          - d82e8275aa9034f305abcdf1d441e96e56b022db
          - 4044d111f31fbb0faad1b6310e1ff1e5d81d9441
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
        row_claims:
          idea: [C-4833d8ca-5]
          key_exemplar: [C-4044d111-3]
          confidence: [C-22c548bc-2]
        rows:
          idea: "An eval set measures the corpus it was labelled against, and enterprise documents evolve continuously underneath it."
          home_anchor: "Like training-serving skew, where the feature distribution moves after the model is fit."
          whats_new_vs_renamed: "Distribution shift is renamed; what is new is that the retriever is structurally blind to staleness."
          reach_for_when: "Reach for a refresh policy the first time a corpus rebuild moves a score you did not touch."
          skip_when: "Skip refreshing when the corpus is a fixed archive, where the documents cannot go stale."
          key_exemplar: "TREC's RAG track replaced MS MARCO v2.1 with ClimbMix-400b as its official corpus for 2026."
          confidence: "contested: standard metrics assume the index is trustworthy, and no refresh cadence is settled"
      - block_id: checklist-drift
        role: matrix
        artifact_kind: checklist
        text: "Record the corpus snapshot identifier beside every score, and refuse to compare two scores taken against different snapshots. Add a fifth dimension for index reliability, because the standard four measure pipeline performance rather than whether the source content is trustworthy. Re-read a benchmark's corpus version before quoting its numbers, since a track can replace its official corpus between years."
        claim_ids: [C-22c548bc-14, C-22c548bc-15, C-4044d111-3]
        provenance: inferred
        source_ids:
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
          - 4044d111f31fbb0faad1b6310e1ff1e5d81d9441
      - block_id: fig-drift
        role: figure
        concept: eval-set-drift
        mode: historical
        caption: "Figure 4: the reported score holds steady across corpus rebuilds while the fraction of still-resolvable labels falls."
        svg_ref: "assets/eval-set-drift.svg"
      - block_id: recall-drift
        role: recall
        claim_ids: [C-22c548bc-2, C-8ee2ad4d-12]
        provenance: verified
        source_ids:
          - 22c548bca734aa2677ccf9be6d95d8fb8745b90a
          - 8ee2ad4d316a9893170f5726fd67893be4787918
        items:
          - question: "A nightly ingest ran and your eval score improved by three points. What do you check?"
            answer: "Whether the index still holds what the labels point at, since these metrics assume the index is trustworthy."
            claim_ids: [C-22c548bc-2]
          - question: "Which production monitoring problem has the same shape?"
            answer: "Training-serving skew, where the data moves after the model was fit and nobody refits it."
            cross_domain: true
          - question: "How does WikiEval bound its own staleness?"
            answer: "By fixing scope — 50 Wikipedia pages covering events since the beginning of 2022 — rather than by refreshing."
            claim_ids: [C-8ee2ad4d-12]

