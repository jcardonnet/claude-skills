# Concept-map for spec-06-user-structured-eval. One concept per user-structure entry, each realized
# in >=3 modes so R-MV-01 passes. Every home_anchor resolves to an ADJACENT technique a mid/senior
# ML engineer already owns — never the concept restated, which is what R-XREF-04 catches.
#
# The four concepts are PINNED by the spec's user_structure and were fixed before the campaign ran,
# so this map is a real test of whether grounding confirms or contradicts a structure chosen up
# front. All four survived. The 2026-08-21 run's own grouper independently produced
# c23-RAG-reliability-and-failure-decomposition + c7-RAG-failure-modes + c8-Error-taxonomy for the
# first, c19-Faithfulness-and-groundedness + c1-Core-RAG-evaluation-metrics for the second,
# c9-LLM-as-judge-evaluation for the third, and c15-Evaluation-metric-validity for the fourth.
#
# ONE THING THE EVIDENCE CHANGED. `faithfulness` used to carry `groundedness` as a bare alias. The
# corpus does not support treating them as one term: a29027ab defines them as SEPARATE failure
# surfaces (C-a29027ab-11 vs C-a29027ab-12) while RAGAS defines faithfulness AS groundedness
# (C-8ee2ad4d-4), and LangChain ships three DIFFERENT evaluators along that seam (C-e0cec4fc-5/6/7).
# An alias asserts the terms are interchangeable, so the alias is wrong and is gone. The
# disagreement is now carried where it belongs — as the symmetric contested pair in the ledger, and
# as the concept's `contested` status. `answer faithfulness` replaces it: that IS the same property
# under another name, per ARES (C-96072ac0-1).
#
# source_ids and claim_ids are the real full-hex ids from tests/fixtures/spec06-grounded/, so every
# id here greps back to the campaign output it came from.
concepts:
  - concept_id: failure-attribution
    canonical_term: "failure attribution"
    aliases: ["stage-wise scoring"]
    home_anchor: "ablating one stage of a training pipeline to see which stage owns the loss"
    fidelity_boundary: "breaks because the two stages need different ground truth — passage labels, then answer labels — not one held-out set"
    epistemic_status: settled
    salience: 0.9
    representation_modes:
      - {mode: mental_model, block_ref: card-attrib}
      - {mode: tradeoff, block_ref: matrix-attrib}
