# Source-ledger for spec-06-user-structured-eval.
#
# THESE SOURCES ARE REAL. Every source_id, url, title, content_hash, claim_id, claim text, quote
# and location below was produced by an actual Phase 1/1a campaign (2026-08-21, 76 min, $5.05) and
# is copied VERBATIM from tests/fixtures/spec06-grounded/source-ledger.yaml, which holds the full
# run: 116 documents fetched, 108 resolved, 30 extracted, 343 claims kept and 62 rejected, 87
# concepts grouped. The 12 sources and 53 claims here are the claims the primer cites plus the ones
# that supply their corroboration — `corroborated_by` holds source_ids, so each corroborating claim
# is carried too, or the count would be an assertion rather than something a reader can check. The
# full-hex source_ids are kept precisely so any claim can be grepped back to the campaign output.
#
# FOUR FIELDS ARE NOT FROM THE RUN, and they are called out here rather than blended in. The
# campaign extracted no `authors`, `venue`, `date` or `credibility` for any source — all four came
# back null across all 30. They are hand-filled at curation time under one rule: only from what the
# identifier or the title already encodes, never from recall.
#   - `authors` carries the PUBLISHING ORGANISATION, not individual bylines. The run captured no
#     bylines, and reconstructing "who wrote the Openlayer post" from memory would be invention.
#     The four arXiv/ACL papers therefore carry an empty author list rather than a guessed one.
#   - `venue` is read off the URL or title (arXiv id, ACL Anthology, NIST TREC, the vendor site).
#   - `date` only where the identifier or title states it: 4833d8ca from its URL path (2026-02-23),
#     a29027ab from "(July 2026)" in its title, 22c548bc and 4044d111 from "2026" in theirs, and the
#     four papers from their arXiv/venue ids (2309.15217 -> 2023-09, 2504.15205 -> 2025-04,
#     2510.13975 -> 2025-10, NAACL 2024 -> 2024-06). The remaining three stay null. `date` is
#     `str | None` in the schema, so a partial YYYY-MM is legal and is preferable to a fabricated day.
#   - `credibility` is an editorial tier: peer-reviewed/standards bodies high, first-party product
#     docs and named engineering blogs medium, undated marketing-adjacent explainers low.
#
# THE TWO CONTESTED PAIRS ARE ALSO EDITORIAL. The campaign found ZERO contested claims in 343 — it
# does not currently look for disagreement, which is a real gap in Phase 1a and not a property of
# this topic, because the corpus plainly disagrees with itself. Both pairs below are conflicts that
# are visible in the retrieved text; the annotation asserting they conflict is curation-time work:
#   - C-a29027ab-12 vs C-8ee2ad4d-4 — whether faithfulness and groundedness are one property.
#     Openlayer defines them as separate failure surfaces; RAGAS defines faithfulness AS
#     groundedness. This one is load-bearing: it is why the concept map no longer carries
#     "groundedness" as a bare alias of faithfulness.
#   - C-22c548bc-20 vs C-4833d8ca-6 — whether the right eval ground truth is institutionally
#     validated business answers or QA triplets generated from the knowledge base.
# They are symmetric in both directions so the conflict is visible from either source (R-GROUND-05).
#
# CORROBORATION IS RECOMPUTED, NOT COPIED. `corroborated_by` is filtered to the 12 sources kept
# here and `corroboration_count` recomputed from the filtered list, so no entry points at a source
# that is not in this file. Exactly one claim lost its only corroborator that way and is now
# uncorroborated; it is not marked as if it were still cross-checked.
#
# WHAT WAS DROPPED, AND WHY IT MATTERS. 18 of the run's 30 sources are not here. Most are ordinary
# topic drift, but one class is worth recording as a NEW instance of GAPS.md G17, and a subtler one
# than spec-05's Cloudflare interstitials. Source 8ee2ad4d IS the RAGAS paper — genuine, on-topic,
# peer-reviewed, correctly typed — and 8 of its 24 extracted claims are facts about the 2023 film
# Oppenheimer and about the Chimnabai Clock Tower in Vadodara. Those are the Wikipedia passages the
# paper uses as WORKED EXAMPLES of its metrics, and the extractor read the paper's illustrative
# material as the paper's findings. No length gate, no fingerprint gate and no relevance gate on the
# DOCUMENT can catch this, because the document is exactly what it should be; the confusion is
# inside it. The same shape put a SQuAD leaderboard page (e51fd256, 20 claims of model names and F1
# scores) and an order-invariance paper (f79418b2, off-topic entirely) into the ledger, and made
# "SQuAD" the grouper's 4th-largest concept at 18 claims. Six of this file's claims come from
# 8ee2ad4d; each was opened against the retrieved text before it was kept.
#
