# Document IR for spec-02-callout-extraction — the FIRST primer in this repo built from a real
# grounding run rather than hand-authored prose. Every claim_id resolves to source-ledger.yaml,
# whose quotes were each verified verbatim against a page actually fetched over the network
# (research/http_fetcher.py), so the R-DISC-01 firewall is satisfied by construction rather than
# by assertion.
#
# The spec is the home~=target stress case (GAPS G1): the reader already does CV and segmentation,
# so every home_anchor names an ADJACENT technique they own — graph traversal, query planning —
# never the concept restated. R-XREF-04 is the lint that catches the degenerate version.
meta:
  parameters:
    home_domain: [classical CV, OCR, instance segmentation, SAM family, document-AI]
    target_domain: "callout/leader-line reading + exploded-view part segmentation for parts catalogues"
    seniority_band: staff_plus
    # The SPEC asks for 8000 words; this artifact is the compact reference realisation of the same
    # contract, so meta records the budget it was actually drafted to (R-ARCH-06 bands off this
    # number). Same convention as document-ir.full.yaml, which records 260 against a 6000-word spec.
    length_budget: 430
    outputs: [html, llm_md]
    reference_case: "binary exploded-view drawing, ~80 numbered leader callouts (some repeated), thin/kinked/dotted leaders, hatching, seated/overlapping parts"
  ledger_snapshot: [s-tgg, s-elsed, s-letr, s-sam]
  model_versions: {generator: stage-g-live, verifier: claude}
  generated_at: "2026-08-16T00:00:00Z"

sections:
  - block_id: sec-leader
    title: "Leader tracing fixes the callout mapping before any segmentation runs"
    concept: leader-tracing
    blocks:
      - block_id: lede-leader
        role: lede
        text: "The callout number to part mapping is decided by leader tracing, so a detector that returns disconnected strokes caps accuracy before segmentation is even reached."
        claim_ids: [C-lead-2]
        provenance: inferred
        source_ids: [s-tgg]
      - block_id: card-leader
        role: card
        concept: leader-tracing
        mode: mental_model
        claim_ids: [C-lead-1, C-lead-2]
        provenance: inferred
        source_ids: [s-tgg]
        rows:
          idea: "A leader is a path, and tracing it is a graph walk from a numeral to a part."
          home_anchor: "Like walking edges in a connectivity graph until you hit a terminal node."
          whats_new_vs_renamed: "The walk is renamed, not new; new is that the graph must be recovered from ink before it can be walked."
          reach_for_when: "Reach for a topological detector when leaders kink, break, or cross hatching."
          skip_when: "Skip it when leaders are straight, unbroken and uncrossed, where a plain segment detector already resolves them."
          key_exemplar: "A connectivity graph that records intersections rather than a bag of segments."
          confidence: "settled for connectivity, contested for how to disambiguate crossings"
      - block_id: matrix-leader
        role: matrix
        concept: leader-tracing
        mode: tradeoff
        artifact_kind: decision_matrix
        text: "Baseline: a topological, connectivity-preserving detector. Growing detectors buy speed and small-gap tolerance at the cost of stored topology; transformer detectors buy heuristic-free operation at the cost of a training set and per-drawing opacity. Use growing when leaders are dotted and throughput matters; use a transformer only once you have labelled drawings from this catalogue family."
        claim_ids: [C-lead-1, C-lead-4, C-lead-5]
        provenance: inferred
        source_ids: [s-tgg, s-elsed, s-letr]
      - block_id: checklist-leader
        role: matrix
        concept: leader-tracing
        artifact_kind: checklist
        text: "Before trusting a mapping: confirm every numeral has exactly one terminal; re-run with hatching masked and diff the mapping; check repeated numerals resolve to distinct parts; verify dotted leaders survive the gap threshold; sample ten crossings by hand."
        claim_ids: [C-lead-2, C-lead-4]
        provenance: inferred
        source_ids: [s-tgg, s-elsed]
      - block_id: fig-leader
        role: figure
        concept: leader-tracing
        mode: architecture
        caption: "Ink becomes a connectivity graph, the graph is walked from numeral to terminal, and only the surviving terminals become part anchors."
        svg_ref: "synthetic/leader-graph.svg"
        claim_ids: [C-lead-1]
        provenance: inferred
        source_ids: [s-tgg]
      - block_id: recall-leader
        role: recall
        concept: leader-tracing
        items:
          - question: "Your mapping is right for straight leaders and wrong wherever one crosses hatching. Which stage do you suspect, and why that one?"
            answer: "Tracing, not detection: the crossing adds a graph edge the drawing never intended, so the walk leaves the leader at the junction."
            cross_domain: false
          - question: "You already run instance segmentation. Why does that not settle which part a numeral refers to?"
            answer: "Segmentation partitions pixels; it does not say which region a numeral points at. The mapping is a graph question, not a mask question."
            cross_domain: true
          - question: "A numeral appears three times on one sheet. What must the tracer output for the result to still be usable?"
            answer: "Three separate terminals, kept distinct — a mapping that collapses them silently loses parts rather than reporting ambiguity."
            cross_domain: false
    subsections:
      - block_id: sub-leader-breaks
        title: "Where a leader stops being one line"
        blocks:
          - block_id: subsum-leader-breaks
            role: summary
            text: "Dotted, kinked and hatch-crossed leaders are the failure surface, and each breaks a different assumption in the pipeline."
            claim_ids: [C-lead-4]
            provenance: inferred
            source_ids: [s-elsed]
          - block_id: body-leader-breaks
            role: body
            concept: leader-tracing
            mode: failure
            text: "A dotted leader is not a line but a sequence of marks, and a detector that demands continuity returns fragments. Such fragments then defeat the walk, because the graph has no edge where the ink has a gap. That gap is what segment growing spans, connecting across small discontinuities so the stroke survives as one edge. The same gap-spanning is what makes hatching dangerous, since a loose threshold bridges a leader into crossing hatch."
            claim_ids: [C-lead-4, C-lead-2]
            provenance: verified
            source_ids: [s-elsed, s-tgg]

  - block_id: sec-anchor
    title: "A resolved anchor is already a prompt, so masks are an output choice not a requirement"
    concept: anchor-seeded-segmentation
    blocks:
      - block_id: lede-anchor
        role: lede
        text: "Once tracing resolves a callout to a point on a part, that point is a segmentation prompt. Whether you spend a mask on it is a downstream decision, not a prerequisite."
        claim_ids: [C-seg-1]
        provenance: inferred
        source_ids: [s-sam]
      - block_id: card-anchor
        role: card
        concept: anchor-seeded-segmentation
        mode: mental_model
        claim_ids: [C-seg-1, C-seg-2]
        provenance: inferred
        source_ids: [s-sam]
        rows:
          idea: "The anchor seeds the segmenter; the segmenter does not find the anchor."
          home_anchor: "Like a query planner handed an index seek instead of scanning the table."
          whats_new_vs_renamed: "Seeding is renamed, not new; new is that the seed arrives from ink topology rather than from a detector."
          reach_for_when: "Reach for masks when a downstream consumer needs part boundaries, such as area or overlap."
          skip_when: "Skip masks when the deliverable is the numeral-to-part table, which the anchor already answers."
          key_exemplar: "A point prompt at the leader terminal, expanded only if a boundary is actually consumed."
          confidence: "contested — zero-shot transfer is evidenced, necessity of masks is not"
      - block_id: toulmin-anchor
        role: toulmin
        concept: anchor-seeded-segmentation
        mode: tradeoff
        text: "Because a promptable segmenter accepts a point, a resolved callout anchor can drive it directly. Qualifier: the anchor must land inside the intended part for that to hold. Rebuttal: on seated parts the anchor lands inside an occluding silhouette instead, and the mask then answers a different question than the one asked."
        claim_ids: [C-seg-1, C-seg-2]
        provenance: inferred
        source_ids: [s-sam]
      - block_id: failures-anchor
        role: matrix
        concept: anchor-seeded-segmentation
        mode: failure
        artifact_kind: failure_catalog
        text: "Anchor-inside-occluder: the terminal lands on the part in front, and the mask describes the wrong component. Prompt-drift: a terminal near an edge expands across the boundary. Mask-without-consumer: masks are produced and never read, paying compute for an unused artifact."
        claim_ids: [C-seg-1]
        provenance: inferred
        source_ids: [s-sam]
      - block_id: aid-anchor
        role: matrix
        concept: anchor-seeded-segmentation
        artifact_kind: decision_aid
        text: "Ask what the consumer reads. A parts table consumes numeral-to-part pairs and needs no mask. An overlap or area report consumes boundaries and does. A human reviewer consumes a highlight, which a box satisfies more cheaply than a mask."
        claim_ids: [C-seg-2]
        provenance: inferred
        source_ids: [s-sam]
      - block_id: fig-anchor
        role: figure
        concept: anchor-seeded-segmentation
        mode: benchmark
        caption: "Zero-shot transfer is reported across image distributions, which removes per-catalogue training; it is silent on whether the mask is needed at all."
        svg_ref: "synthetic/anchor-transfer.svg"
        claim_ids: [C-seg-2]
        provenance: verified
        source_ids: [s-sam]
      - block_id: recall-anchor
        role: recall
        concept: anchor-seeded-segmentation
        items:
          - question: "The deliverable is a numeral-to-part table and someone proposes running a segmenter over every callout. What is the argument against, in one sentence?"
            answer: "The table consumes anchors, not boundaries, so every mask is compute spent on an artifact nothing downstream reads."
            cross_domain: false
          - question: "You have used SAM-family models for instance masks before. What transfers here, and what does not?"
            answer: "Promptability transfers, because the anchor is a point prompt. The assumption that a mask is the deliverable does not."
            cross_domain: true
          - question: "A seated part gives an anchor inside the occluding component. What does the mask actually describe, and what would you check?"
            answer: "It describes the occluder, not the referenced part; check whether the terminal falls inside a silhouette that another callout already claims."
            cross_domain: false
