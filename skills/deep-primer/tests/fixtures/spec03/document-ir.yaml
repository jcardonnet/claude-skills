# Document IR for spec-03-observability-tracing — the SMALL-BUDGET reference artifact.
#
# What this fixture is for: proving the apparatus scales DOWN (R-DEPTH-03). Section 1 carries the
# full field guide because context propagation is the load-bearing concept (salience 0.95); section
# 2 drops the figure and the subsection; section 3 is a lede, a card, one decision aid and a figure
# and stops. The four operational artifacts (R-ART-01) are spread 2/1/1 across the three sections
# rather than replicated per section, and no section manufactures a summary it does not need —
# R-CONSIST-01 requires one only past ~400 body words, and none of these sections comes near it.
#
# Section lengths are deliberately non-uniform so R-ARCH-06's near-uniform padding heuristic stays
# quiet with real headroom rather than by a hair.
#
# The SPEC asks for 2500 words; this is the compact reference realisation of the same contract, so
# meta records the budget it was actually drafted to — the length_budget check bands off that number
# and off `text` + `caption` only. Same convention as document-ir.full.yaml (260 against a 6000-word
# spec) and spec02/document-ir.yaml (430 against 8000).
#
# SOURCES ARE REAL (2026-08-20 campaign) — see source-ledger.yaml. Every block_id, role,
# artifact_kind, mode, section title and concept id is unchanged from the structural fixture this
# replaced; only the claim-bearing prose and its citations were re-drafted against what the campaign
# actually found. Three blocks moved inferred -> verified because a real source states exactly what
# they assert, which the old three-claim synthetic ledger could not support: [fig-propagation],
# [failures-sampling] and [fig-cardinality]. That is what takes ungrounded_share from 0.60 to 0.40.
#
# The blocks still marked `inferred` are inferred by their nature, not by accident: a decision
# matrix, a checklist, a sub-summary, an extended mechanism narrative and a Toulmin argument are
# synthesis GROUNDED IN cited claims, not restatements of them.
meta:
  parameters:
    home_domain: [backend services, relational databases]
    target_domain: "distributed tracing and the observability stack"
    seniority_band: mid_senior
    length_budget: 400
    outputs: [html]
  ledger_snapshot:
    - bd3da1a2855aa88a7bae89fbf1d3a205c89a95df
    - c33bab732ffdab0be4a4d077705eae94c77ddbb0
