# Document IR for spec-03-observability-tracing — the SMALL-BUDGET reference artifact.
#
# What this fixture is for: proving the apparatus scales DOWN (R-DEPTH-03). Section 1 carries the
# full field guide because context propagation is the load-bearing concept (salience 0.95); section
# 2 drops the figure and the subsection; section 3 is a lede, a card, one decision aid and a figure
# and stops. The four operational artifacts (R-ART-01) are spread 2/1/1 across the three sections
# rather than replicated per section, and no section manufactures a summary it does not need —
# R-CONSIST-01 requires one only past ~400 body words, and none of these sections comes near it.
#
# Section lengths are deliberately non-uniform (roughly 211 / 113 / 78 counted words) so R-ARCH-06's
# near-uniform padding heuristic stays quiet with real headroom rather than by a hair.
#
# The SPEC asks for 2500 words; this is the compact reference realisation of the same contract, so
# meta records the budget it was actually drafted to — the length_budget check bands off that number
# and off `text` + `caption` only. Same convention as document-ir.full.yaml (260 against a 6000-word
# spec) and spec02/document-ir.yaml (430 against 8000).
#
# Sources are SYNTHETIC (example.org, fictional authors) — see source-ledger.yaml.
meta:
  parameters:
    home_domain: [backend services, relational databases]
    target_domain: "distributed tracing and the observability stack"
    seniority_band: mid_senior
    length_budget: 400
    outputs: [html]
  ledger_snapshot: [s-ctx, s-samp, s-card]
  model_versions: {generator: test-fixture, verifier: lexical}
  generated_at: "2026-08-18T00:00:00Z"

sections:
  # Highest salience: everything downstream inherits whatever propagation produced, so this is the
  # only section that earns a subsection and two operational artifacts.
  - block_id: sec-propagation
    title: "A trace stops at the first hop that forgets to pass the context"
    concept: context-propagation
    blocks:
      - block_id: lede-propagation
        role: lede
        text: "A trace truncates at the first hop that drops the propagated context, so instrumentation coverage matters more than any collector behind it."
        claim_ids: [C-ctx-1]
        provenance: verified
        source_ids: [s-ctx]
      - block_id: card-propagation
        role: card
        concept: context-propagation
        mode: mental_model
        claim_ids: [C-ctx-1]
        provenance: verified
        source_ids: [s-ctx]
        row_claims:
          idea: [C-ctx-1]
        rows:
          idea: "Context propagation is the thread that makes separate spans one trace."
          home_anchor: "The transaction id you already thread through every statement in one unit of work."
          whats_new_vs_renamed: "Threading an id is renamed, not new; new is that the id must survive process boundaries and libraries you did not write."
          reach_for_when: "Reach for a propagation audit when traces arrive complete on some routes and truncated on others."
          skip_when: "Skip it when every span already shares one trace id and the gap is missing attributes instead."
          key_exemplar: "A traceparent header copied onto an outbound request by framework middleware."
          confidence: "settled for the truncation mechanism; contested for how much manual instrumentation remains unavoidable"
      - block_id: matrix-propagation
        role: matrix
        artifact_kind: decision_matrix
        concept: context-propagation
        mode: tradeoff
        text: "Baseline: propagate in framework middleware and let application code stay unaware. Manual propagation buys coverage inside odd transports at the cost of every future maintainer remembering it. An auto-instrumentation agent buys breadth at the cost of an opaque gap whenever a library it patches moves underneath it."
        claim_ids: [C-ctx-1, C-ctx-2]
        # inferred, not verified: the baseline recommendation and the two cost clauses are synthesis
        # GROUNDED IN the cited claims rather than stated by them.
        provenance: inferred
        source_ids: [s-ctx]
      - block_id: checklist-propagation
        role: matrix
        artifact_kind: checklist
        text: "Compare span counts per route against request counts. Confirm the outbound client copies the header. Check that queue producers serialize context into the message body. Re-run one known-slow route and count the hops that appear."
        claim_ids: [C-ctx-2]
        provenance: inferred
        source_ids: [s-ctx]
      - block_id: fig-propagation
        role: figure
        concept: context-propagation
        mode: architecture
        caption: "Figure 1: one dropped header splits a single trace into two roots, and neither root reports the real end-to-end latency."
        svg_ref: "synthetic/context-hops.svg"
        claim_ids: [C-ctx-1]
        provenance: inferred
        source_ids: [s-ctx]
      - block_id: recall-propagation
        role: recall
        concept: context-propagation
        items:
          - question: "Your checkout trace ends at the payment service every time, yet payment logs show downstream calls. What is broken?"
            answer: "Propagation out of the payment service, not collection: the downstream spans exist, but they start a new trace with no parent."
          - question: "What plays the role here that a transaction id plays inside a relational database?"
            answer: "The trace id, which ties otherwise independent operations into one unit you can reason about as a whole."
            cross_domain: true
          - question: "When does adding collector capacity fail to lengthen a truncated trace?"
            answer: "Always, because the missing spans were never emitted with a parent, and no amount of collection reconstructs a link that was never sent."

    subsections:
      - block_id: sub-prop-queue
        title: "Queues are where the parent link disappears without an error"
        concept: context-propagation
        blocks:
          - block_id: subsum-prop-queue
            role: summary
            text: "A synchronous hop loses context to a missing header; an asynchronous hop loses it to a message that carried none."
            claim_ids: [C-ctx-2]
            provenance: inferred
            source_ids: [s-ctx]
          - block_id: body-prop-queue
            role: body
            concept: context-propagation
            mode: failure
            heading: "Where the orphaned root span comes from"
            text: "A queue hop breaks the parent link whenever the producer leaves context out of the message. That hop then starts a second trace, and the consumer emits an orphaned root span. The orphaned span carries real latency, so the service dashboard stays green while the user waits. That span never rejoins its parent, and no query over the trace store recovers the link afterwards."
            claim_ids: [C-ctx-2]
            provenance: inferred
            source_ids: [s-ctx]

  # Mid salience: a card, one argued tradeoff, one failure catalog. No figure, no subsection.
  - block_id: sec-sampling
    title: "Tail-based sampling keeps the traces worth keeping and bills you in collector memory"
    concept: tail-based-sampling
    blocks:
      - block_id: lede-sampling
        role: lede
        text: "Head sampling discards the errors before anyone knows they were errors, which is the whole reason tail-based sampling exists."
        claim_ids: [C-samp-1]
        provenance: verified
        source_ids: [s-samp]
      - block_id: card-sampling
        role: card
        concept: tail-based-sampling
        mode: mental_model
        claim_ids: [C-samp-1, C-samp-2]
        provenance: verified
        source_ids: [s-samp]
        row_claims:
          idea: [C-samp-1]
          key_exemplar: [C-samp-2]
        rows:
          idea: "The sampling decision waits until the trace is complete, so it can see the outcome."
          home_anchor: "The slow-query log that records a statement only after it crosses a duration threshold."
          whats_new_vs_renamed: "Deciding after the fact is renamed, not new; new is that the decision spans many processes and no single one holds the answer."
          reach_for_when: "Reach for it when errors and p99 outliers are rare enough that uniform sampling loses them."
          skip_when: "Skip it when trace volume already fits the budget, since buffering adds a failure mode for nothing."
          key_exemplar: "A collector holding every span of an in-flight trace until the root span closes."
          confidence: "settled for what it keeps; contested for whether collector memory is the binding constraint"
      - block_id: toulmin-sampling
        role: toulmin
        concept: tail-based-sampling
        mode: tradeoff
        text: "When error traces matter more than uniform coverage, reach for tail-based sampling at the collector. Qualifier: the collector can defer that decision only while every buffered trace fits memory. Rebuttal: under a burst the collector evicts in-flight traces, and the evicted traces are exactly the slow ones you wanted."
        claim_ids: [C-samp-1, C-samp-2]
        # inferred: the claim/qualifier/rebuttal shape is authored argument built on the two cited
        # claims, not a restatement of either.
        provenance: inferred
        source_ids: [s-samp]
      - block_id: failures-sampling
        role: matrix
        artifact_kind: failure_catalog
        concept: tail-based-sampling
        mode: failure
        text: "Memory cliff: a traffic burst fills the buffer and the collector drops in-flight traces indiscriminately. Late root: a trace whose root span closes after the buffer window is decided on partial evidence. Silent bias: keeping only errors leaves the retained latency distribution unrepresentative of production."
        claim_ids: [C-samp-2]
        provenance: inferred
        source_ids: [s-samp]
      - block_id: recall-sampling
        role: recall
        concept: tail-based-sampling
        items:
          - question: "Error traces vanished after sampling dropped from every request to one in twenty. Which sampler are you running?"
            answer: "A head sampler, which decides before the outcome is known and therefore retains an error only by luck."
          - question: "Your database already logs statements past a duration threshold. What does tail-based sampling add?"
            answer: "The threshold is evaluated across every service in one request, rather than per statement inside one engine."
            cross_domain: true
          - question: "Collector memory grew with traffic and then fell off a cliff. What happened at the cliff?"
            answer: "Buffered in-flight traces filled the collector, and eviction discarded whole traces before their sampling decision was reached."

  # Lowest salience: a mention with an aid attached. Deliberately no subsection, no checklist, no
  # heavier artifact — the thin section R-DEPTH-03 exists to protect.
  - block_id: sec-cardinality
    title: "Cardinality, not span volume, is what makes the observability bill unpredictable"
    concept: attribute-cardinality
    blocks:
      - block_id: lede-cardinality
        role: lede
        text: "Storage and query cost track distinct attribute combinations rather than span count, so one user-id attribute outgrows a tenfold traffic increase."
        claim_ids: [C-card-1]
        provenance: verified
        source_ids: [s-card]
      - block_id: card-cardinality
        role: card
        concept: attribute-cardinality
        mode: mental_model
        claim_ids: [C-card-1]
        provenance: verified
        source_ids: [s-card]
        row_claims:
          idea: [C-card-1]
        rows:
          idea: "Attribute cardinality, not span volume, sets what a trace store costs to hold and query."
          home_anchor: "The distinct-value count you weigh before putting an index on a column."
          whats_new_vs_renamed: "Counting distinct values is renamed, not new; new is that the key set is open, so one request can mint a key nobody declared."
          reach_for_when: "Reach for a cardinality audit when the bill climbs while request volume stays flat."
          skip_when: "Skip it when spans carry only enumerated attributes such as route, status, and region."
          key_exemplar: "A span attribute holding a raw user id on every request."
          confidence: "settled for the cost driver; contested for where the practical ceiling sits"
      - block_id: aid-cardinality
        role: matrix
        artifact_kind: decision_aid
        concept: attribute-cardinality
        mode: tradeoff
        text: "Ask what a query will group by. An attribute you group by earns its cardinality; an attribute you read only after a trace is already found belongs in the span body rather than the index."
        claim_ids: [C-card-1]
        provenance: inferred
        source_ids: [s-card]
      - block_id: fig-cardinality
        role: figure
        concept: attribute-cardinality
        mode: cost
        caption: "Figure 2: cost climbs with distinct attribute combinations while span volume stays flat, so the curve is driven by breadth rather than traffic."
        svg_ref: "synthetic/cardinality-cost.svg"
        claim_ids: [C-card-1]
        provenance: inferred
        source_ids: [s-card]
      - block_id: recall-cardinality
        role: recall
        concept: attribute-cardinality
        items:
          - question: "Traffic is flat month over month and the trace bill doubled. Where do you look first?"
            answer: "At newly added span attributes: one high-cardinality key multiplies distinct combinations without adding a single span."
          - question: "You would never index a column of raw email addresses. Which span attributes does that rule out?"
            answer: "Attributes of the same shape — user ids, session tokens, full URLs — whose distinct-value count grows with traffic."
            cross_domain: true
          - question: "When is a high-cardinality attribute worth what it costs?"
            answer: "When a query groups by it. An attribute read only after a trace is found needs no index at all."
