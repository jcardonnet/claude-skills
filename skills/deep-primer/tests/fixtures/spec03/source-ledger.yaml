# Source-ledger for spec-03-observability-tracing.
#
# THESE SOURCES ARE REAL. Every source_id, url, title, content_hash, claim_id, claim text and quote
# below was produced by an actual Phase 1/1a campaign (2026-08-20) and is copied VERBATIM from
# tests/fixtures/spec03-grounded/source-ledger.yaml, which holds the full run: 143 source leads,
# 128 documents fetched, 30 extracted, 271 claims kept. The 13 sources and 41 claims here are the
# subset the primer actually cites. The full-hex source_ids are kept precisely so any claim can be
# grepped back to the campaign output it came from.
#
# Three fields were HAND-FILLED after the run because the pipeline drops them, not because they were
# judged: `type`, `date` and `credibility`. `retrieval_loop.fetch_source_leads` never copies
# `lead.type` onto the fetched document, so every campaign source lands with type/date/credibility
# null. `date` is filled only where the document itself evidences one (both oneuptime posts carry
# 2026-02-06 in their URL; the OpenTelemetry cardinality post carries 2026). `type` is left null for
# the three GitHub issue/discussion threads: SourceType has no bucket for community discussion, and
# calling a thread `docs` or `blog` would be a worse lie than an absent value. No lint reads either
# field — they feed the source-quality critics (R-EVID-02/03).
#
# Only TWO corroboration pairs are recorded, and both are cross-organisation. They were found by
# reading, because the 2026-08-20 campaign's own corroborate() pass found 0 of 271: it ran on the
# lexical similarity backend, which cannot see that two sources agree unless they agree in the same
# words. That backend is now a fallback rather than the default (ClaudeCorroborationGrouper), and a
# replay of this same ledger through the model path finds 17 — so treat the count below as what one
# careful reader marked, not as the pipeline's ceiling. Several other pairs LOOK corroborating and are deliberately not marked: the two B3
# claims live in the same repository, and the two load-balancing-exporter claims are both oneuptime
# posts. Same-origin agreement is not corroboration (R-EVID-03).
#
# No claim is marked `contested`. The campaign found no contradiction across 30 sources, and
# manufacturing one would make this fixture assert something the literature does not.
# `contested`/`contradicts` coverage lives in tests/fixtures/source-ledger.yaml and specs 04-06.
#
# Quotes are <=15 words (R-GROUND-01). They are NOT lexically close to the blocks that cite them —
# R-GROUND-01 requires the prose to be a paraphrase, so the offline lexical entailment proxy scores
# them low by design. citation_quality gates `verified_recall`/`verified_precision` only when a real
# entailment backend is present; offline, only resolves_to_ledger / scoreable / ungrounded_share bind.
