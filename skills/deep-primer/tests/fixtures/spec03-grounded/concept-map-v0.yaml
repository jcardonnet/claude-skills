- concept_id: c17-Time-series-cardinality-management
  canonical_term: Time series cardinality management
  aliases:
  - Cardinality explosion control
  - label cardinality limits
  home_anchor: Column cardinality and index resource consumption
  fidelity_boundary: Stores every distinct label combination as a separate in-memory
    time series without automatic deduplication; cardinality attacks exhaust memory
    and cause data loss—unlike indexed databases which compress high-cardinality columns
    and fail gracefully
