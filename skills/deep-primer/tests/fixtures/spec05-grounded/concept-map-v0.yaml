- concept_id: c6-Data-reuse-and-positive-dependence
  canonical_term: Data reuse and positive dependence
  aliases:
  - inference correlation from shared data
  - statistical dependence in multiple testing
  home_anchor: Independence assumptions in multiple hypothesis testing
  fidelity_boundary: Standard multiplicity corrections assume independent test statistics
    across disjoint datasets; shared data creates positive dependence that standard
    corrections cannot address.
