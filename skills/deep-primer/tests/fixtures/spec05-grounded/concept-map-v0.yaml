- concept_id: c4-Biomarker-driven-trial-structures
  canonical_term: Biomarker-driven trial structures
  aliases:
  - basket trials
  - umbrella trials
  - platform trials
  - enrichment designs
  home_anchor: Stratified and factorial experimental designs
  fidelity_boundary: Stratified designs maintain separate randomization per stratum
    with a fixed control arm; biomarker-driven trials often lack concurrent controls,
    share control groups across substudies, and use Bayesian elimination rules.
  epistemic_status: settled
  salience: 0.2432
