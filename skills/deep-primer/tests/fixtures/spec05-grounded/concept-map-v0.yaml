- concept_id: c9-Stopping-induced-estimation-bias
  canonical_term: Stopping-induced estimation bias
  aliases:
  - conditional bias in early stopping
  - estimation after sequential stopping
  home_anchor: Unbiasedness of point estimators under fixed sample plans
  fidelity_boundary: Standard estimators are unbiased under predetermined stopping;
    optional stopping based on test statistics induces conditional bias dependent
    on which boundary condition triggered.
  epistemic_status: settled
  salience: 0.1081
