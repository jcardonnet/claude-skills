- concept_id: c5-Regulatory-and-payer-assessment-of-novel
  canonical_term: Regulatory and payer assessment of novel trials
  aliases:
  - health technology assessment of adaptive designs
  - evidence requirements for novel trials
  - payer interpretation of uncertainty
  home_anchor: Treatment effect comparison under model and population uncertainty
  fidelity_boundary: Standard evaluation assumes a single defined treatment comparison
    and homogeneous population; novel trials introduce multiple indications, adaptive
    arm selection, and biomarker-defined subgroups that complicate effect attribution.
