- concept_id: c1-Sample-size-re-estimation
  canonical_term: Sample size re-estimation
  aliases:
  - interim sample size reassessment
  - adaptive sample size modification
  - Adaptive Sample Size Re-estimation
  - Sample size recalculation
  - adaptive reassessment
  - sample size re-evaluation
  home_anchor: Sequential analysis with optional stopping
  fidelity_boundary: Sequential analysis stops based on a single interim look; sample
    size re-estimation uses prospectively planned interim points to adjust future
    enrollment based on effect size estimates subject to regulatory constraints.
