# eval-rubric.yaml — scoring overlay for the eval harness (Stage 6, Prompt 7).
# Three tiers, matching the registry's enforcement model.
hard_lints:        # from scripts/lint.py against the IR; MUST failures block (priority-derived)
  weight: 1.0
  source: lint-report.json
model_verified:    # scripts/verify/* (citation recall/precision; chunk self-containment)
  weight: 1.0
  source: verify-report.json
  thresholds:
    # STILL TODO, and the reason is now specific rather than "not enough data".
    #
    # Measured with verify/claude_entailment.py (sonnet, majority-of-3, ~$4/run):
    #     spec-01  verified_recall 0.29 (2/7)   verified_precision 0.25   inferred_share 0.00
    #     spec-02  verified_recall 0.50 (1/2)   inferred_share 0.85
    # propose_thresholds() offers min-0.05 on the overall numbers. DO NOT take it: flooring at the
    # worst artifact makes a bar that cannot fail — the ratchet running backwards.
    #
    # Three things have to land before a number here means anything:
    #
    #  1. JUDGE STABILITY. Two runs over identical artifacts gave spec-01 4/7 then 3/7. Under
    #     majority-of-3 haiku still split 7 of 38 ballots (~18%); sonnet split 1 of 11 (~9%). A
    #     floor fitted to a judge that moves like that measures the judge. Calibrate on sonnet with
    #     --entailment-votes 3, never on a single haiku pass.
    #  2. THE UNIT IS WRONG FOR COMPOSITE BLOCKS. A card is seven typed rows — idea, home_anchor,
    #     reach_for_when, skip_when, ... — and R-GROUND-01 caps a quote at 15 words. One quote
    #     cannot entail all seven, and `skip_when` is the author's operational judgement rather than
    #     something a source asserts. spec-01's cards fail for that structural reason, not because
    #     their citations are bad. Entailment wants to run per-ROW (or per-assertion), not per-block.
    #  3. MORE THAN TWO SPECS, and at least one from a real generation rather than a fixture.
    #
    # When those hold, gate `verified_recall` — not the overall number, which conflates declared
    # synthesis with claimed grounding — and anchor to principle: a block asserting `verified` whose
    # citation does not entail it is a defect, so the target is ~0.95. If real primers cannot reach
    # that, the gap is the finding; do not lower the bar to meet them.
    citation_recall: 0.75      # TODO: tune against real runs (registry budgets)
    citation_precision: 0.90   # TODO
human_overlay:     # spot-checked, calibrates the soft critics
  weight: 1.0
  divergence_recalibrate_threshold: 0.25

# --- the coverage ratchet (what `eval.py --strict` enforces) ------------------
# Stage A's finding was that an unenforced rule is indistinguishable from a passing one. The report
# has carried `enforcement_coverage` since Prompt 7, but nothing ever FAILED on it — measured, never
# gated, which is the same shape of hole one tier up.
#
# These are a RATCHET, not an aspiration: every number is what the offline run actually achieves
# today, so the gate locks in current coverage and fails the moment it regresses. Raise a floor when
# real coverage rises (Stage G artifacts, a wired judge). Never lower one to make a red run green —
# that is precisely the silent erosion this exists to catch.
#
# Counts, not fractions: the registry grows. A fractional floor weakens itself every time a rule is
# added, so the gate would quietly loosen exactly when the surface got larger.
coverage_floor:
  hard_lint: 32       # 32/32. R-CONV-01 was the last one dark, and was NOT closed by handing
                      # run_convergence_loop the scripted judge — that replays findings it was told
                      # in advance. research/claude_structure_judge.py judges the real map instead.
  model_verified: 3   # 3/3 — R-PROJ-04 was dark until the gate caught it; keep it that way
  soft_critic: 35     # 35/35 — was 2/35 until the tier got a real judge; never let it slide back
  human: 9            # 9/9 — NOT a review pass. Every one of these turned out to assert
                      # something about the CODEBASE (four prohibitions, five architecture
                      # invariants), so checks/conformance.py checks them against the source
                      # tree. Each check is proved falsifiable by a negative test; 9/9 on a
                      # clean tree is otherwise indistinguishable from nine tautologies.
