# Exercises G6 (R-ARCH-07): an explicit user structure governs the top-level outline while headings
# stay predictive claims. Note the deliberately generic user labels — copying them verbatim would
# violate R-SCENT-01, so the two rules can only coexist via maps_to.
id: spec-06-user-structured-eval
parameters:
  home_domain: ["ML engineering"]
  target_domain: "evaluation of retrieval-augmented systems"
  primer_type: survey
  seniority_band: mid_senior
  length_budget: 4500
  outputs: [html, llm_md]
  user_structure:
    - "Background"
    - "Metrics that matter"
    - "Tooling"
    - "Open problems"
# A hand-built REFERENCE artifact on REAL sources. The outline came first — the four `user_structure`
# entries above pin the four concepts — and a Phase 1/1a campaign was then run against this exact
# target_domain on 2026-08-21 (76 min, $5.05, 116 documents fetched, 30 extracted, 343 claims kept,
# 87 concepts grouped). Raw campaign output is committed under tests/fixtures/spec06-grounded/;
# tests/fixtures/spec06/ is the curated 12-source, 53-claim subset the artifact cites, and its
# ledger header records which fields were hand-filled at curation time and why.
# That ordering is what makes this spec worth more than a structural fixture: the structure was
# chosen before the evidence, so the evidence could have broken it. All four concepts survived; one
# alias did not (`groundedness` is no longer a synonym for `faithfulness` — see concept-map.yaml).
# The soft_critic rules in `expect.must_pass` still need a judge run; offline they report as the
# documented judge gap rather than as a pass.
artifact:
  ir: tests/fixtures/spec06/document-ir.yaml
  concept_map: tests/fixtures/spec06/concept-map.yaml
  ledger: tests/fixtures/spec06/source-ledger.yaml
  # Judged 2026-08-27 — one of five runs that ended this spec's status as never-critic-judged.
  # Until now every one of the 35 soft_critic rules was credited from spec-01 alone: 44% of the
  # registry resting on a single document, which cannot distinguish a rule that discriminates from
  # a rule that only ever agreed with the one artifact written beside it.
  #
  # Regenerate with
  #   scripts/critics/run_critics.py <ir> --judge claude --model haiku --gating-model sonnet \
  #     --out <here>
  # (249 calls, ~$30.91-equivalent — gating rules are judged twice, hence calls > verdicts).
  # 8 MUST failures. The largest document (21 blocks) and the largest run, at 249 calls.
  #
  # Flake on this run: 6/80 gating verdicts flipped when asked a second time. That figure is
  # recorded, not gating (the FIRST verdict decides), and it is not a constant of the judge — across
  # the five runs it tracks document size, from 3/39 here-abouts to 10/65 on spec-05. A flake rate
  # measured on one artifact does not transfer to another, which is the same argument as this
  # comment's first paragraph, arrived at from the other direction.
  #
  # R-ARCH-01 fails on all five of these specs for one reason, not five: none of their IRs carries
  # the `front_matter` block that c0c3477 added to spec-01 for exactly this rule. That was
  # predictable from `grep front_matter` before a single call was made, and it was left unfixed on
  # purpose — editing an IR moves its digest, and eval then refuses the report beside it as stale.
  # Fixing the artifacts is the right move; doing it before judging would have meant judging five
  # documents this session had just rewritten, and doing it after means one re-judge, so batch them.
  #
  # The report carries `ir_sha256` of the IR it judged, and eval REFUSES to credit it as coverage
  # if that no longer matches.
  critic_report: tests/fixtures/spec06/critic-report.json
expect:
  must_pass: [R-ARCH-07, R-SCENT-01, R-CONSIST-01]
  watch: [maps_to_declared, heading_not_copied_verbatim]
  notes: "every section must declare maps_to; no heading may be the bare user label"
