# Mid-band, modest budget, HTML only. Checks that the apparatus scales DOWN (R-DEPTH-03):
# a 2500-word primer must not carry the same heavy artifact set as an 8000-word one.
id: spec-03-observability-tracing
parameters:
  home_domain: ["backend services", "relational databases"]
  target_domain: "distributed tracing and the observability stack"
  seniority_band: mid_senior
  length_budget: 2500
  outputs: [html]
# A hand-built REFERENCE artifact, in the same spirit as spec-01's — not a real generation.
# Its sources are openly synthetic (`example.org`, fictional authors) because this fixture exercises
# STRUCTURE: it is what lets this spec's deterministic rules run against a document shaped the way
# the spec describes. It makes no grounding claim, and it is deliberately distinguishable at a glance
# from spec-02's ledger, which came from a real campaign with verbatim-verified quotes.
# The soft_critic rules in `expect.must_pass` still need a judge run; offline they report as the
# documented judge gap rather than as a pass.
artifact:
  ir: tests/fixtures/spec03/document-ir.yaml
  concept_map: tests/fixtures/spec03/concept-map.yaml
  ledger: tests/fixtures/spec03/source-ledger.yaml
expect:
  must_pass: [R-ARCH-03, R-SCENT-01, R-CARD-02, R-RECALL-01, R-CONSIST-01, R-ARCH-06]
  watch: [apparatus_proportionality]
  notes: "small budget: R-DEPTH-03 should suppress padding, and R-ARCH-06's uniform-length heuristic should stay quiet"
