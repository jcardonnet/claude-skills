# Exercises seed_sources end-to-end (R-DISC-06): a direct URL seed plus an author directive.
# The seed must be consulted and grounded, exempt from triage-drop, and still corroboration-graded.
id: spec-04-seeded-vector-index
parameters:
  home_domain: ["classical IR"]
  target_domain: "approximate nearest-neighbour index selection"
  seniority_band: mid_senior
  length_budget: 4000
  outputs: [html, llm_md]
seed_sources:
  - {kind: url, ref: "https://example.org/hnsw-paper", note: "user-supplied"}
  - {kind: author, ref: "Y. Malkov", note: "survey their work"}
expect:
  must_pass: [R-DISC-06, R-GROUND-01, R-GROUND-05, R-EVID-03]
  watch: [seed_not_dropped, seed_not_promoted_past_evidence]
  notes: "a seed contradicted by the discovered consensus must render as contested, not as settled"
