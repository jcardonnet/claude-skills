# Exercises seed_sources end-to-end (R-DISC-06): a direct URL seed plus an author directive.
# The seed must be consulted and grounded, exempt from triage-drop, and still corroboration-graded.
id: spec-04-seeded-vector-index
parameters:
  home_domain: ["classical IR"]
  target_domain: "approximate nearest-neighbour index selection"
  primer_type: survey
  seniority_band: mid_senior
  length_budget: 4000
  outputs: [html, llm_md]
seed_sources:
  - {kind: url, ref: "https://arxiv.org/abs/1603.09320", note: "user-supplied"}
  - {kind: author, ref: "Y. Malkov", note: "survey their work"}
# A hand-built REFERENCE artifact, in the same spirit as spec-01's — not a real generation.
# Its sources are openly synthetic (`example.org`, fictional authors) because this fixture exercises
# STRUCTURE: it is what lets this spec's deterministic rules run against a document shaped the way
# the spec describes. It makes no grounding claim, and it is deliberately distinguishable at a glance
# from spec-02's ledger, which came from a real campaign with verbatim-verified quotes.
# The soft_critic rules in `expect.must_pass` still need a judge run; offline they report as the
# documented judge gap rather than as a pass.
artifact:
  ir: tests/fixtures/spec04/document-ir.yaml
  concept_map: tests/fixtures/spec04/concept-map.yaml
  ledger: tests/fixtures/spec04/source-ledger.yaml
  # Judged 2026-08-27 — one of five runs that ended this spec's status as never-critic-judged.
  # Until now every one of the 35 soft_critic rules was credited from spec-01 alone: 44% of the
  # registry resting on a single document, which cannot distinguish a rule that discriminates from
  # a rule that only ever agreed with the one artifact written beside it.
  #
  # Regenerate with
  #   scripts/critics/run_critics.py <ir> --judge claude --model haiku --gating-model sonnet \
  #     --out <here>
  # (180 calls, ~$24.56-equivalent — gating rules are judged twice, hence calls > verdicts).
  # 7 MUST failures and 3 unanswered items, the most errors of any run.
  #
  # Flake on this run: 6/53 gating verdicts flipped when asked a second time. That figure is
  # recorded, not gating (the FIRST verdict decides), and it is not a constant of the judge — across
  # the five runs it tracks document size, from 3/39 here-abouts to 10/65 on spec-05. A flake rate
  # measured on one artifact does not transfer to another, which is the same argument as this
  # comment's first paragraph, arrived at from the other direction.
  #
  # R-ARCH-01 fails on all five of these specs for one reason, not five: none of their IRs carries
  # the `front_matter` block that c0c3477 added to spec-01 for exactly this rule. That was
  # predictable from `grep front_matter` before a single call was made, and it was left unfixed on
  # purpose — editing an IR moves its digest, and eval then refuses the report beside it as stale.
  # Fixing the artifacts is the right move; doing it before judging would have meant judging five
  # documents this session had just rewritten, and doing it after means one re-judge, so batch them.
  #
  # The report carries `ir_sha256` of the IR it judged, and eval REFUSES to credit it as coverage
  # if that no longer matches.
  critic_report: tests/fixtures/spec04/critic-report.json
  discovery_leads: tests/fixtures/spec04/discovery-leads.yaml
expect:
  must_pass: [R-DISC-06, R-GROUND-01, R-GROUND-05, R-EVID-03]
  watch: [seed_not_dropped, seed_not_promoted_past_evidence]
  notes: "a seed contradicted by the discovered consensus must render as contested, not as settled"
