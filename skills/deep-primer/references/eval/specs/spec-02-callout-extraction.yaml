# Stress spec: home≈target (CV->niche sub-task), reference-case grounding, dual outputs.
# Exercises dry-run gaps G1/G2/G6 — keep until those are resolved.
id: spec-02-callout-extraction
parameters:
  home_domain: ["classical CV", "OCR", "instance segmentation", "SAM family", "document-AI"]
  target_domain: "callout/leader-line reading + exploded-view part segmentation for parts catalogues"
  seniority_band: staff_plus
  length_budget: 8000
  outputs: [html, llm_md]
reference_case: "binary exploded-view drawing, ~80 numbered leader callouts (some repeated), thin/kinked/dotted leaders, hatching, seated/overlapping parts"
# The first artifact in this repo produced by a REAL grounding run rather than hand-authored prose:
# sources found by web search, fetched over the network by research/http_fetcher.py, and every quote
# in the ledger verified verbatim against the fetched body (R-DISC-01) at <=15 words (R-GROUND-01).
# One candidate quote was rejected at 16 words, which is the cap doing its job rather than a nuisance.
artifact:
  ir: tests/fixtures/spec02/document-ir.yaml
  concept_map: tests/fixtures/spec02/concept-map.yaml
  ledger: tests/fixtures/spec02/source-ledger.yaml
  # The campaign's own audit trail from the same 3-wave run. Wiring these is what lets eval reach
  # R-DISC-02/03/06 — deterministic rules implemented in Stage B that no spec had ever handed an
  # artifact, so they sat permanently in the "needs a discovery campaign artifact" bucket and were
  # counted as an explained gap rather than an unmet one.
  discovery_log: tests/fixtures/spec02/discovery-log.yaml
  discovery_leads: tests/fixtures/spec02/discovery-leads.yaml
  briefs: tests/fixtures/spec02/briefs.yaml
expect:
  must_pass: [R-ARCH-03, R-CARD-03, R-ART-03, R-ART-04, R-EVID-03, R-PROJ-05]
  watch: [G1_home_equals_target, G2_reference_case_vs_worked_example, G6_user_structure_override]
